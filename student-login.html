<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIIA — მოსწავლის ავტორიზაცია</title>

    <style>
      :root {
        --primary: #6c63ff;
        --secondary: #4a90ff;
        --achievement: #f59e0b;
        --success: #22c55e;
        --error: #ff4d4f;

        --text: #151938;
        --muted: #83889b;
        --border: #e2e3eb;
        --background: #ffffff;
        --info-bg: #f7f5ff;
        --info-icon-bg: #eae7ff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--background);
        color: var(--text);
        font-family: "Noto Sans Georgian", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .page {
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0 auto;
        padding: 0 22px 36px;
      }

      /* BACK BUTTON */

      .topbar {
        padding-top: 28px;
        display: flex;
        align-items: center;
      }

      .back-btn {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        background: transparent;
        border: none;
        color: var(--text);
        padding: 0;
      }

      .back-btn svg {
        width: 28px;
        height: 28px;
      }

      /* LOGO */

      .logo {
        margin: clamp(20px, 4dvh, 42px) auto 22px;
        text-align: center;
      }

      .logo-text {
        display: inline-block;
        font-family: Arial, sans-serif;
        font-size: clamp(55px, 15vw, 76px);
        font-weight: 900;
        letter-spacing: -5px;
        line-height: 1.1;
        background: linear-gradient(120deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* HEADING */

      .heading {
        text-align: center;
        margin-bottom: 24px;
      }

      .heading h1 {
        margin: 0 0 10px;
        font-size: clamp(20px, 5.4vw, 27px);
        font-weight: 800;
        line-height: 1.4;
      }

      .heading p {
        margin: 0;
        color: var(--muted);
        font-size: clamp(14px, 3.8vw, 17px);
      }

      /* COLLAPSIBLE INFORMATION CARD */

      .student-info {
        width: 100%;
        margin-bottom: 26px;
        background: var(--info-bg);
        border-radius: 14px;
        overflow: hidden;
      }

      .info-toggle {
        width: 100%;
        min-height: 62px;
        padding: 10px 13px;
        display: flex;
        align-items: center;
        gap: 11px;
        border: none;
        background: transparent;
        color: var(--text);
        text-align: left;
      }

      .info-icon {
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--info-icon-bg);
        border-radius: 12px;
        color: var(--primary);
      }

      .info-icon svg {
        width: 23px;
        height: 23px;
      }

      .info-title {
        flex: 1;
        min-width: 0;
        font-size: clamp(12px, 3.3vw, 14px);
        font-weight: 700;
        line-height: 1.5;
      }

      .info-chevron {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        color: var(--primary);
        transition: transform 0.2s ease;
      }

      .student-info.open .info-chevron {
        transform: rotate(180deg);
      }

      .info-content {
        padding: 0 15px 17px;
        color: var(--text);
        font-size: 12px;
        line-height: 1.8;
        font-weight: 500;
      }

      .info-content[hidden] {
        display: none;
      }

      .info-content-inner {
        border-top: 1px solid #e5e1ff;
        padding-top: 13px;
      }

      .info-content p {
        margin: 0;
      }

      .info-content p + p {
        margin-top: 12px;
      }

      /* FORM */

      .login-form {
        width: 100%;
      }

      .field {
        margin-bottom: 20px;
      }

      .field-label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        font-size: 16px;
        font-weight: 700;
        color: #41475a;
      }

      .field-label svg {
        width: 21px;
        height: 21px;
        stroke-width: 1.9;
      }

      .input-wrap {
        position: relative;
        width: 100%;
      }

      .leading-icon {
        position: absolute;
        top: 50%;
        left: 18px;
        transform: translateY(-50%);
        width: 23px;
        height: 23px;
        color: #a1a6b7;
        pointer-events: none;
      }

      .text-input {
        width: 100%;
        height: 60px;
        padding: 0 52px 0 55px;
        border: 1.5px solid var(--border);
        border-radius: 17px;
        outline: none;
        background: #ffffff;
        color: var(--text);
        font-size: 16px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .text-input::placeholder {
        color: #a4a8b6;
      }

      .text-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.09);
      }

      .text-input.invalid {
        border-color: var(--error);
      }

      .toggle-password {
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        background: transparent;
        border: none;
        color: #a1a6b7;
      }

      .toggle-password svg {
        width: 23px;
        height: 23px;
      }

      .error-message {
        display: none;
        color: var(--error);
        font-size: 12px;
        margin: 8px 4px 0;
      }

      .error-message.visible {
        display: block;
      }

      /* LOGIN BUTTON */

      .login-btn {
        position: relative;
        width: 100%;
        height: 62px;
        margin-top: 6px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(120deg, var(--primary), #5949e9);
        box-shadow: 0 8px 20px rgba(108, 99, 255, 0.23);
        color: #ffffff;
        font-size: 19px;
        font-weight: 800;
      }

      .login-btn:active {
        transform: scale(0.99);
      }

      .login-btn .arrow {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        display: grid;
        place-items: center;
      }

      .login-btn .arrow svg {
        width: 26px;
        height: 26px;
      }

      /* DIVIDER */

      .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 27px 0 24px;
        color: #9295a3;
        font-size: 15px;
      }

      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: var(--border);
      }

      /* GUEST BUTTON */

      .guest-btn {
        width: 100%;
        min-height: 60px;
        padding: 12px 10px;
        border: 1.5px solid var(--primary);
        border-radius: 16px;
        background: #ffffff;
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: clamp(12px, 3.6vw, 16px);
        font-weight: 700;
      }

      .guest-btn svg {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
      }

      .guest-btn:active {
        background: #f6f4ff;
      }

      button:focus-visible {
        outline: 3px solid var(--secondary);
        outline-offset: 3px;
      }

      /* SMALL MOBILES */

      @media (max-width: 360px) {
        .page {
          padding-left: 16px;
          padding-right: 16px;
          padding-bottom: 24px;
        }

        .topbar {
          padding-top: 16px;
        }

        .logo {
          margin-top: 18px;
          margin-bottom: 16px;
        }

        .heading {
          margin-bottom: 18px;
        }

        .student-info {
          margin-bottom: 20px;
        }

        .info-toggle {
          padding: 8px 10px;
          gap: 9px;
        }

        .info-icon {
          width: 38px;
          height: 38px;
          flex-basis: 38px;
        }

        .info-content {
          font-size: 11px;
          padding-left: 12px;
          padding-right: 12px;
        }

        .field {
          margin-bottom: 14px;
        }

        .text-input {
          height: 54px;
        }

        .login-btn {
          height: 56px;
        }

        .divider {
          margin: 20px 0;
        }
      }

      /* SHORT SCREENS */

      @media (max-height: 700px) {
        .topbar {
          padding-top: 14px;
        }

        .logo {
          margin-top: 12px;
          margin-bottom: 14px;
        }

        .heading {
          margin-bottom: 16px;
        }

        .student-info {
          margin-bottom: 18px;
        }

        .field {
          margin-bottom: 12px;
        }

        .divider {
          margin: 18px 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <!-- BACK -->
      <header class="topbar">
        <button
          class="back-btn"
          type="button"
          aria-label="უკან დაბრუნება"
          onclick="window.location.href = 'index.html'"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M15 18L9 12L15 6" />
          </svg>
        </button>
      </header>

      <!-- AIIA LOGO WITHOUT STAR -->
      <div class="logo">
        <div class="logo-text">AIIA</div>
      </div>

      <!-- TITLE -->
      <section class="heading">
        <h1>მოსწავლის ავტორიზაცია</h1>
        <p>შეიყვანე შენი მონაცემები</p>
      </section>

      <!-- COLLAPSIBLE INFORMATION -->
      <section class="student-info" id="studentInfo">
        <button
          class="info-toggle"
          id="infoToggle"
          type="button"
          aria-expanded="false"
          aria-controls="infoContent"
        >
          <span class="info-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="8" cy="15" r="4" />
              <path d="M10.8 12.2L20 3" />
              <path d="M16 7l3 3" />
              <path d="M18 5l3 3" />
            </svg>
          </span>

          <span class="info-title"> როგორ გავიარო ავტორიზაცია? </span>

          <svg
            class="info-chevron"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>

        <div class="info-content" id="infoContent" hidden>
          <div class="info-content-inner">
            <p>
              რეგისტრაციისთვის მშობელმა უნდა გადმოწეროს აპლიკაცია და შეგიქმნას
              მოსწავლის პროფილი.
            </p>

            <p>
              ამის შემდეგ ის მიიღებს ლოგინს და პაროლს, რომლითაც შეძლებ
              ავტორიზაციას.
            </p>
          </div>
        </div>
      </section>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="login-form" novalidate>
        <!-- USERNAME -->
        <div class="field">
          <label class="field-label" for="username">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="7" r="3.5" />
              <path d="M4.5 20v-2.5c0-4 15-4 15 0V20Z" />
            </svg>
            ლოგინი
          </label>

          <div class="input-wrap">
            <svg
              class="leading-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M16 9v5c0 2 4 2 4-2" />
              <circle cx="12" cy="12" r="4" />
            </svg>

            <input
              id="username"
              class="text-input"
              type="text"
              placeholder="შეიყვანე ლოგინი"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
            />
          </div>

          <p id="usernameError" class="error-message" role="alert"></p>
        </div>

        <!-- PASSWORD -->
        <div class="field">
          <label class="field-label" for="password">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="5" y="10" width="14" height="11" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              <circle cx="12" cy="15" r="1" />
            </svg>
            პაროლი
          </label>

          <div class="input-wrap">
            <svg
              class="leading-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="5" y="10" width="14" height="11" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>

            <input
              id="password"
              class="text-input"
              type="password"
              placeholder="შეიყვანე პაროლი"
              autocomplete="current-password"
              required
            />

            <button
              class="toggle-password"
              type="button"
              id="togglePassword"
              aria-label="პაროლის ჩვენება"
              aria-pressed="false"
            >
              <svg
                id="eyeIcon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>

          <p id="passwordError" class="error-message" role="alert"></p>
        </div>

        <!-- LOGIN -->
        <button class="login-btn" type="submit">
          შესვლა
          <span class="arrow">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 12h16M13 5l7 7-7 7" />
            </svg>
          </span>
        </button>
      </form>

      <!-- DIVIDER -->
      <div class="divider">ან</div>

      <!-- GUEST -->
      <button class="guest-btn" type="button" onclick="continueAsGuest()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        გააგრძელე სტუმრის რეჟიმში
      </button>
    </main>

    <script>
      const form = document.getElementById("loginForm");
      const username = document.getElementById("username");
      const password = document.getElementById("password");
      const togglePassword = document.getElementById("togglePassword");
      const eyeIcon = document.getElementById("eyeIcon");

      const studentInfo = document.getElementById("studentInfo");
      const infoToggle = document.getElementById("infoToggle");
      const infoContent = document.getElementById("infoContent");

      /* ACCORDION */

      infoToggle.addEventListener("click", () => {
        const isOpen = infoToggle.getAttribute("aria-expanded") === "true";
        const nextOpen = !isOpen;

        infoToggle.setAttribute("aria-expanded", String(nextOpen));
        infoContent.hidden = !nextOpen;
        studentInfo.classList.toggle("open", nextOpen);
      });

      /* VALIDATION */

      function showError(input, message) {
        const error = document.getElementById(input.id + "Error");
        error.textContent = message;
        error.classList.add("visible");
        input.classList.add("invalid");
        input.setAttribute("aria-invalid", "true");
      }

      function clearError(input) {
        const error = document.getElementById(input.id + "Error");
        error.textContent = "";
        error.classList.remove("visible");
        input.classList.remove("invalid");
        input.removeAttribute("aria-invalid");
      }

      [username, password].forEach((input) => {
        input.addEventListener("input", () => clearError(input));
      });

      /* SHOW / HIDE PASSWORD */

      togglePassword.addEventListener("click", () => {
        const isHidden = password.type === "password";

        password.type = isHidden ? "text" : "password";

        togglePassword.setAttribute("aria-pressed", String(isHidden));

        togglePassword.setAttribute(
          "aria-label",
          isHidden ? "პაროლის დამალვა" : "პაროლის ჩვენება",
        );

        if (isHidden) {
          eyeIcon.innerHTML = `
      <path d="M3 3l18 18"/>
      <path d="M10.6 5.1A10.5 10.5 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.3 4.2"/>
      <path d="M6.2 6.2C3.4 8.2 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/>
    `;
        } else {
          eyeIcon.innerHTML = `
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
      <circle cx="12" cy="12" r="3"/>
    `;
        }
      });

      /* DEMO LOGIN */

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        let valid = true;

        if (!username.value.trim()) {
          showError(username, "შეიყვანე ლოგინი");
          valid = false;
        }

        if (!password.value) {
          showError(password, "შეიყვანე პაროლი");
          valid = false;
        }

        if (!valid) return;
        if (username.value.trim() !== "1111" || password.value !== "2222") {
          showError(password, "ლოგინი ან პაროლი არასწორია");
          return;
        }
        // დემო რეჟიმი: სერვერზე ავტორიზაცია ჯერ არ ხდება.
        // პაროლი არ ინახება.
        sessionStorage.setItem("aiia_demo_role", "student");
        sessionStorage.setItem("aiia_demo_mode", "preview");

        window.location.href = "student-home.html";
      });

      /* GUEST MODE */

      function continueAsGuest() {
        window.location.href = "guest/guest-home.html";
      }
    </script>
  </body>
</html>
