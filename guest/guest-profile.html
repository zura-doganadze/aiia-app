<!doctype html>

<html lang="ka">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>AIIA — სტუმრის პროფილი</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #6c63ff;
        --text: #202338;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: #fff;
        color: var(--text);
        font-family: "Noto Sans Georgian", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      .app {
        width: 100%;
        max-width: 1040px;
        margin: auto;
        min-height: 100dvh;
        padding: 24px 16px calc(100px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .content {
        width: 100%;
        max-width: 440px;
      }

      .register-card {
        width: 100%;
        background: linear-gradient(180deg, #fbfaff 0%, #f7f6ff 100%);
        border: 1px solid #e9e5ff;
        border-radius: 26px;
        padding: 35px 25px 30px;
        text-align: center;
        box-shadow: 0 12px 35px rgba(67, 56, 156, 0.055);
      }

      .register-icon {
        width: 74px;
        height: 74px;
        border-radius: 24px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        background: #ece9ff;
        color: var(--primary);
      }

      .register-icon svg {
        width: 38px;
        height: 38px;
      }

      .register-card h1 {
        font-size: 21px;
        font-weight: 800;
        margin: 0 0 12px;
        line-height: 1.45;
      }

      .register-card p {
        font-size: 13px;
        line-height: 1.9;
        color: #707b93;
        margin: 0 auto 26px;
        max-width: 320px;
      }

      .register-btn {
        display: block;
        width: 100%;
        background: var(--primary);
        color: #fff;
        border-radius: 14px;
        padding: 15px 16px;
        font-size: 14px;
        font-weight: 800;
        box-shadow: 0 7px 18px rgba(108, 99, 255, 0.18);
        transition:
          background 0.2s,
          transform 0.2s;
      }

      .register-btn:hover {
        background: #5950e9;
      }

      .register-btn:active {
        transform: scale(0.99);
      }

      .parent-note {
        display: block;
        margin-top: 13px;
        font-size: 11px;
        line-height: 1.6;
        color: #8991a6;
      }

      .login-link {
        display: inline-block;
        margin-top: 24px;
        font-size: 12px;
        line-height: 1.6;
        font-weight: 800;
        color: var(--primary);
      }

      .login-link:hover {
        text-decoration: underline;
      }

      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(100%, 1040px);
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
        border-radius: 25px 25px 0 0;
        background: rgba(255, 255, 255, 0.97);
        box-shadow: 0 -6px 25px rgba(26, 31, 67, 0.08);
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        z-index: 20;
      }

      .nav-link {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        min-width: 0;
        color: #9297a7;
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }

      .nav-icon {
        width: 39px;
        height: 36px;
        border-radius: 13px;
        display: grid;
        place-items: center;
      }

      .nav-icon svg {
        width: 23px;
        height: 23px;
      }

      .nav-link.active {
        color: #553de4;
      }

      .nav-link.active .nav-icon {
        background: #eeebff;
      }

      :focus-visible {
        outline: 3px solid #4a90ff;
        outline-offset: 3px;
      }

      @media (max-width: 400px) {
        .bottom-nav {
          padding-left: 5px;
          padding-right: 5px;
        }
        .nav-icon {
          width: 34px;
          height: 33px;
        }
        .nav-icon svg {
          width: 21px;
          height: 21px;
        }
        .register-card {
          padding: 30px 19px 26px;
        }
      }

      @media (max-height: 550px) {
        .app {
          align-items: flex-start;
        }
      }
    </style>
  </head>

  <body>
    <main class="app">
      <div class="content">
        <section class="register-card" aria-labelledby="profile-title">
          <div class="register-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m2 9 10-5 10 5-10 5L2 9Z" />
              <path d="M6 11v5c3 3 9 3 12 0v-5" />
              <path d="M22 9v7" />
            </svg>
          </div>

          <h1 id="profile-title">შექმენი შენი პროფილი</h1>

          <p>
            შეინახე შენი პროგრესი, მიღწევები და მიიღე პერსონალური დახმარება
            მიასგან.
          </p>

          <a class="register-btn" href="../student-login.html"
            >პროფილის შექმნა</a
          >

          <small class="parent-note"
            >პროფილის შექმნაში მშობელი დაგეხმარება</small
          >

          <a class="login-link" href="../student-login.html"
            >უკვე გაქვს მოსწავლის კოდი? შესვლა</a
          >
        </section>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="მთავარი ნავიგაცია">
      <a class="nav-link" href="guest-home.html" aria-label="მთავარი"
        ><span class="nav-icon"
          ><svg viewBox="0 0 24 24" fill="currentColor">
            <path d="m3 11 9-8 9 8v10h-7v-7h-4v7H3Z" /></svg></span
      ></a>

      <a class="nav-link" href="guest-mia.html" aria-label="მია"
        ><span class="nav-icon"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="4" y="6" width="16" height="14" rx="3" />
            <path
              d="M12 2v4M9 2h6M1 12h3m16 0h3M8 12h1m6 0h1M9 16c2 1 4 1 6 0"
            /></svg></span
      ></a>

      <a class="nav-link" href="guest-achievements.html" aria-label="მიღწევები"
        ><span class="nav-icon"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M8 21h8M12 17v4M7 4H5a2 2 0 0 0-2 2v2a5 5 0 0 0 5 5M17 4h2a2 2 0 0 1 2 2v2a5 5 0 0 1-5 5"
            />
            <path d="M7 3h10v7a5 5 0 0 1-10 0V3Z" /></svg></span
      ></a>

      <a
        class="nav-link active"
        href="guest-profile.html"
        aria-label="პროფილი"
        aria-current="page"
        ><span class="nav-icon"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-5 3-8 8-8s8 3 8 8" /></svg></span
      ></a>
    </nav>
  </body>
</html>
