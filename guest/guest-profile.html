<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIIA — სტუმრის პროფილი</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #6c63ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fff;
        color: #18213c;
        font-family: "Noto Sans Georgian", sans-serif;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      .app {
        max-width: 1040px;
        margin: auto;
        min-height: 100vh;
        padding: 20px 16px 115px;
      }

      .content {
        max-width: 460px;
        margin: auto;
      }

      .register-card {
        background: #f8f7ff;
        border: 1px solid #e5e0ff;
        border-radius: 18px;
        padding: 24px 18px;
        text-align: center;
      }

      .register-icon {
        font-size: 30px;
        margin-bottom: 10px;
      }

      .register-card h2 {
        font-size: 16px;
        font-weight: 800;
        margin: 0 0 10px;
      }

      .register-card p {
        font-size: 12px;
        line-height: 1.8;
        color: #65718a;
        margin: 0 0 18px;
      }

      .register-btn {
        display: block;
        background: var(--primary);
        color: white;
        border-radius: 11px;
        padding: 13px;
        font-size: 13px;
        font-weight: 800;
      }

      .parent-note {
        display: block;
        margin-top: 11px;
        font-size: 10px;
        color: #8892a9;
      }

      .login-link {
        display: block;
        margin-top: 16px;
        font-size: 12px;
        font-weight: 700;
        color: var(--primary);
      }

      /* მთავარი გვერდის იდენტური ფუტერი */

      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(100%, 1040px);
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
        border-radius: 25px 25px 0 0;
        background: rgba(255, 255, 255, 0.97);
        box-shadow: 0 -6px 25px rgba(26, 31, 67, 0.08);
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        z-index: 20;
      }

      .nav-link {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        min-width: 0;
        color: #9297a7;
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }

      .nav-icon {
        width: 39px;
        height: 36px;
        border-radius: 13px;
        display: grid;
        place-items: center;
      }

      .nav-icon svg {
        width: 23px;
        height: 23px;
      }

      .nav-link.active {
        color: #553de4;
      }

      .nav-link.active .nav-icon {
        background: #eeebff;
      }

      @media (max-width: 400px) {
        .bottom-nav {
          padding-left: 5px;
          padding-right: 5px;
        }

        .nav-icon {
          width: 34px;
          height: 33px;
        }

        .nav-icon svg {
          width: 21px;
          height: 21px;
        }
      }
    </style>
  </head>

  <body>
    <main class="app">
      <div class="content">
        <section class="register-card">
          <div class="register-icon">🎓</div>
          <h2>შექმენი შენი პროფილი</h2>

          <p>
            შეინახე შენი პროგრესი, მიღწევები და მიიღე პერსონალური დახმარება
            მიასგან.
          </p>

          <a class="register-btn" href="../student-login.html">
            პროფილის შექმნა
          </a>

          <small class="parent-note">
            პროფილის შექმნაში მშობელი დაგეხმარება
          </small>

          <a class="login-link" href="../student-login.html">
            უკვე გაქვს მოსწავლის კოდი? შესვლა
          </a>
        </section>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="მთავარი ნავიგაცია">
      <a class="nav-link" href="guest-home.html" aria-label="მთავარი">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="m3 11 9-8 9 8v10h-7v-7h-4v7H3Z" />
          </svg>
        </span>
      </a>

      <a class="nav-link" href="guest-mia.html" aria-label="მია">
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="4" y="6" width="16" height="14" rx="3" />
            <path
              d="M12 2v4M9 2h6M1 12h3m16 0h3M8 12h1m6 0h1M9 16c2 1 4 1 6 0"
            />
          </svg>
        </span>
      </a>

      <a class="nav-link" href="guest-achievements.html" aria-label="მიღწევები">
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M8 21h8M12 17v4M7 4H5a2 2 0 0 0-2 2v2a5 5 0 0 0 5 5M17 4h2a2 2 0 0 1 2 2v2a5 5 0 0 1-5 5"
            />
            <path d="M7 3h10v7a5 5 0 0 1-10 0V3Z" />
          </svg>
        </span>
      </a>

      <a
        class="nav-link active"
        href="guest-profile.html"
        aria-label="პროფილი"
        aria-current="page"
      >
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-5 3-8 8-8s8 3 8 8" />
          </svg>
        </span>
      </a>
    </nav>
  </body>
</html>
