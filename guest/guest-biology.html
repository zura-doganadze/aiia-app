<!doctype html>

<html lang="ka">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>AIIA — სტუმარი | ბიოლოგია</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #6c63ff;
        --secondary: #4a90ff;
        --success: #22c55e;
        --warning: #f59e0b;
        --gold: #ffc857;
        --text: #111827;
        --muted: #6b7280;
        --neutral: #eff0f4;
        --white: #ffffff;
        --line: #eff0f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--white);
        color: var(--text);
        font-family: "Noto Sans Georgian", Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
      }

      button,
      a {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      svg {
        display: block;
      }

      .app {
        width: 100%;
        max-width: 1040px;
        margin: 0 auto;
        padding: 20px 16px 118px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 22px;
      }

      .menu {
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        border: 2px solid var(--neutral);
        background: var(--white);
        border-radius: 12px;
        display: grid;
        place-items: center;
      }

      .header-title {
        flex: 1;
        min-width: 0;
      }

      .header-title h1 {
        font-size: 28px;
        line-height: 1.25;
        margin: 0 0 4px;
        font-weight: 700;
      }

      .header-title p {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }

      .xp {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 11px;
        border-radius: 12px;
        background: var(--neutral);
        color: var(--text);
        font-weight: 600;
        font-size: 12px;
        white-space: nowrap;
      }

      .xp span {
        font-size: 19px;
      }

      .progress-card {
        border: 2px solid var(--neutral);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--white);
      }

      .ring {
        height: 64px;
        width: 64px;
        border: 6px solid var(--neutral);
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: 0 0 64px;
        color: var(--primary);
        font-size: 18px;
        font-weight: 700;
      }

      .progress-body {
        flex: 1;
        min-width: 0;
      }

      .progress-body h2 {
        font-size: 18px;
        line-height: 1.35;
        margin: 0 0 4px;
        font-weight: 600;
      }

      .progress-body p {
        color: var(--muted);
        font-size: 12px;
        margin: 0 0 10px;
      }

      .track {
        height: 8px;
        border-radius: 8px;
        background: var(--neutral);
        overflow: hidden;
      }

      .fill {
        height: 100%;
        width: 0;
        background: var(--primary);
        border-radius: 8px;
        transition: width 0.2s;
      }

      .stat-icon {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        background: var(--neutral);
        border-radius: 12px;
        color: var(--primary);
        flex: 0 0 40px;
      }

      .section-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin: 26px 0 14px;
      }

      .section-top h2 {
        font-size: 24px;
        margin: 0;
        font-weight: 600;
      }

      .all {
        border: 0;
        background: none;
        color: var(--primary);
        font-size: 12px;
        font-weight: 600;
        padding: 6px 0;
        text-align: right;
      }

      .chapters {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 2px 1px 8px;
        margin-bottom: 20px;
        scrollbar-width: none;
      }

      .chapters::-webkit-scrollbar {
        display: none;
      }

      .chapter-card {
        flex: 0 0 clamp(136px, 40vw, 176px);
        height: 122px;
        text-align: left;
        position: relative;
        border-radius: 16px;
        padding: 12px;
        background: var(--white);
        color: var(--text);
        border: 2px solid var(--neutral);
        transition:
          background 0.2s,
          color 0.2s,
          transform 0.2s;
      }

      .chapter-card.chapter-upcoming {
        background: #ffffff !important;
        background-image: none !important;
        opacity: 1 !important;
        color: var(--text) !important;
        border: 2px solid var(--neutral) !important;
        filter: none !important;
        cursor: default;
      }

      .chapter-card.active {
        background: var(--primary);
        color: var(--white);
        border-color: var(--primary);
      }

      button.chapter-card:active {
        transform: scale(0.98);
      }

      .chapter-number {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 30px;
        height: 30px;
        border-radius: 10px;
        background: var(--neutral);
        color: var(--primary);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 14px;
      }

      .chapter-card.active .chapter-number {
        background: var(--white);
        color: var(--primary);
      }

      .chapter-count {
        position: absolute;
        right: 12px;
        top: 16px;
        font-size: 12px;
        font-weight: 600;
      }

      .chapter-name {
        position: absolute;
        bottom: 12px;
        left: 12px;
        right: 12px;
        font-size: 16px;
        line-height: 1.4;
        font-weight: 600;
      }

      .lesson-panel {
        border: 2px solid var(--neutral);
        border-radius: 16px;
        padding: 0 12px 12px;
        background: var(--white);
        overflow: hidden;
      }

      .lesson-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 -12px 12px;
        padding: 15px 14px;
        background: var(--neutral);
      }

      .lesson-heading h2 {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        line-height: 1.4;
        margin: 0;
        font-weight: 600;
        min-width: 0;
      }

      .lesson-heading h2::before {
        content: "";
        display: block;
        width: 4px;
        height: 25px;
        border-radius: 4px;
        background: var(--primary);
        flex: 0 0 4px;
      }

      .chapter-tag {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }

      .lessons {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .lesson {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 66px;
        padding: 12px;
        background: var(--white);
        border: 2px solid var(--neutral);
        border-radius: 12px;
        text-align: left;
      }

      .lesson:hover {
        border-color: var(--primary);
      }

      .lesson-index {
        font-weight: 600;
        font-size: 14px;
        flex: 0 0 42px;
        color: var(--muted);
      }

      .lesson-title {
        font-weight: 500;
        font-size: 14px;
        line-height: 1.5;
        flex: 1;
        min-width: 0;
      }

      .status {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #d1d5db;
        flex: 0 0 24px;
      }

      .status.in-progress {
        background: var(--warning);
      }
      .status.done {
        background: var(--success);
      }

      .chevron {
        font-size: 25px;
        line-height: 1;
        color: var(--muted);
        flex: none;
      }

      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(100%, 1040px);
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
        border: 2px solid var(--neutral);
        border-bottom: 0;
        border-radius: 16px 16px 0 0;
        background: rgba(255, 255, 255, 0.98);
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        z-index: 20;
      }

      .nav-link {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-width: 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }

      .nav-icon {
        width: 40px;
        height: 38px;
        border-radius: 12px;
        display: grid;
        place-items: center;
      }

      .nav-icon svg {
        width: 23px;
        height: 23px;
      }

      .nav-link.active {
        color: var(--primary);
      }
      .nav-link.active .nav-icon {
        background: var(--neutral);
      }

      .nav-link span:last-child {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }

      :focus-visible {
        outline: 3px solid var(--secondary);
        outline-offset: 3px;
      }

      @media (max-width: 480px) {
        .app {
          padding: 16px 14px 112px;
        }
        .header-title h1 {
          font-size: 22px;
        }
        .section-top h2 {
          font-size: 20px;
        }
        .progress-body h2 {
          font-size: 16px;
        }
        .lesson-heading h2 {
          font-size: 17px;
        }
        .stat-icon {
          display: none;
        }
        .nav-link {
          font-size: 11px;
        }
      }

      @media (max-width: 360px) {
        .app {
          padding-left: 10px;
          padding-right: 10px;
        }
        .progress-card {
          gap: 10px;
          padding: 12px;
        }
        .ring {
          width: 54px;
          height: 54px;
          flex-basis: 54px;
          font-size: 16px;
        }
        .lesson {
          gap: 7px;
          padding: 9px;
        }
        .lesson-title {
          font-size: 13px;
        }
        .lesson-index {
          flex-basis: 34px;
        }
        .bottom-nav {
          padding-left: 5px;
          padding-right: 5px;
        }
      }

      @media (min-width: 481px) and (max-width: 1024px) {
        .app {
          padding: 24px 24px 125px;
        }
        .chapter-card {
          flex-basis: 185px;
        }
      }

      @media (min-width: 1025px) {
        .app {
          padding: 32px 32px 130px;
        }
        .chapter-card {
          flex-basis: 200px;
          height: 132px;
        }
        .lesson-panel {
          padding: 0 18px 18px;
        }
        .lesson-heading {
          margin: 0 -18px 16px;
          padding: 18px;
        }
        .lesson {
          min-height: 74px;
        }
      }

      /* Guest-only access states; all shared visual rules above are identical to registered Math. */

      .lesson.locked {
        background: #f9fafb;
        color: #9ca3af;
        border-color: var(--neutral);
      }

      .lesson.locked:hover {
        border-color: var(--neutral);
      }

      .lesson.locked .lesson-title,
      .lesson.locked .lesson-index {
        color: #9ca3af;
      }

      .lesson.locked .chevron {
        display: none;
      }

      .lock-icon {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
        color: #9ca3af;
      }

      .lock-icon svg {
        width: 22px;
        height: 22px;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(22, 25, 50, 0.48);
      }

      .modal-overlay.show {
        display: flex;
      }

      .modal {
        position: relative;
        width: 100%;
        max-width: 390px;
        padding: 27px 22px;
        border-radius: 16px;
        background: #fff;
        text-align: center;
        box-shadow: 0 20px 60px rgba(20, 20, 70, 0.15);
      }

      .modal-icon {
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        margin: 0 auto 15px;
        border-radius: 12px;
        background: var(--neutral);
        color: var(--primary);
      }

      .modal h2 {
        margin: 0 0 10px;
        font-size: 19px;
        font-weight: 700;
      }

      .modal p {
        margin: 0 0 20px;
        font-size: 13px;
        line-height: 1.8;
        color: var(--muted);
      }

      .modal-action {
        display: block;
        width: 100%;
        padding: 13px;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        font-size: 13px;
        font-weight: 700;
      }

      .modal-close {
        position: absolute;
        top: 12px;
        right: 14px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 23px;
      }
    </style>
  </head>

  <body>
    <main class="app">
      <!-- HEADER -->

      <header class="header">
        <button
          class="menu"
          type="button"
          aria-label="უკან დაბრუნება"
          onclick="location.href = 'guest-home.html'"
        >
          <svg
            width="25"
            height="25"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#34363b"
            stroke-width="2.5"
            stroke-linecap="round"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>

        <div class="header-title">
          <h1>ბიოლოგია</h1>

          <p id="gradeLabel">V კლასი</p>
        </div>

        <div class="xp">
          <span>🏆</span>

          <strong id="xpValue">0 XP</strong>
        </div>
      </header>

      <!-- PROGRESS -->

      <section class="progress-card">
        <div class="ring" id="progress-ring">0%</div>

        <div class="progress-body">
          <h2>სწავლის პროგრესი</h2>

          <p id="progress-text">0/10 დასრულებული</p>

          <div class="track">
            <div class="fill" id="progress-fill"></div>
          </div>
        </div>

        <div class="stat-icon">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          >
            <path d="M5 19V11M12 19V5M19 19v-7" />
          </svg>
        </div>
      </section>

      <!-- CHAPTERS -->

      <div class="section-top">
        <h2>თავები</h2>

        <button
          class="all"
          type="button"
          onclick="
            document

              .getElementById('chapters')

              .scrollIntoView({ behavior: 'smooth' })
          "
        >
          ყველა თავის ნახვა ›
        </button>
      </div>

      <div class="chapters" id="chapters"></div>

      <!-- LESSONS -->

      <section class="lesson-panel">
        <div class="lesson-heading">
          <h2 id="selected-title"></h2>

          <span class="chapter-tag" id="selected-number"></span>
        </div>

        <div class="lessons" id="lessons"></div>
      </section>
    </main>

    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-nav" aria-label="მთავარი ნავიგაცია">
      <a
        class="nav-link active"
        href="guest-home.html"
        aria-current="page"
        aria-label="მთავარი"
      >
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="m3 11 9-8 9 8v10h-7v-7h-4v7H3Z" />
          </svg>
        </span>
      </a>

      <a class="nav-link" href="guest-mia.html" aria-label="AI მენტორი">
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="4" y="6" width="16" height="14" rx="3" />

            <path
              d="M12 2v4M9 2h6M1 12h3m16 0h3M8 12h1m6 0h1M9 16c2 1 4 1 6 0"
            />
          </svg>
        </span>
      </a>

      <a class="nav-link" href="guest-achievements.html" aria-label="მიღწევები">
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M8 21h8M12 17v4M7 4H5a2 2 0 0 0-2 2v2a5 5 0 0 0 5 5M17 4h2a2 2 0 0 1 2 2v2a5 5 0 0 1-5 5"
            />

            <path d="M7 3h10v7a5 5 0 0 1-10 0V3Z" />
          </svg>
        </span>
      </a>

      <a class="nav-link" href="guest-profile.html" aria-label="პროფილი">
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="8" r="4" />

            <path d="M4 21c0-5 3-8 8-8s8 3 8 8" />
          </svg>
        </span>
      </a>
    </nav>

    <!-- REGISTRATION MODAL -->

    <div
      class="modal-overlay"
      id="registerModal"
      onclick="closeRegister(event)"
    >
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <button
          class="modal-close"
          type="button"
          onclick="closeRegister()"
          aria-label="დახურვა"
        >
          ×
        </button>

        <div class="modal-icon">
          <svg
            width="27"
            height="27"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="5" y="10" width="14" height="11" rx="2" />

            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
        </div>

        <h2 id="modalTitle">გააგრძელე სწავლა AIIA-სთან</h2>

        <p>
          ეს გაკვეთილი რეგისტრირებულ მოსწავლეებს შეუძლიათ გაიარონ. სთხოვე
          მშობელს რომ დაგარეგისტრიროს.
        </p>

        <a class="modal-action" href="../student-login.html">რეგისტრაცია</a>
      </div>
    </div>

    <script>
      /* FIRST THREE LESSONS ARE FREE */

      const chapters = [
        {
          name: "ადამიანის ორგანიზმი",

          lessons: [
            { title: "გული და სისხლის მიმოქცევა" },

            { title: "სისხლი და მისი შემადგენლობა" },

            { title: "სისხლძარღვები" },

            { title: "გულის აგებულება" },

            { title: "სისხლის მიმოქცევის წრეები" },

            { title: "გულის მუშაობა" },

            { title: "სისხლის მიმოქცევის სისტემის ჯანმრთელობა" },
          ],
        },

        {
          name: "სუნთქვის სისტემა",

          lessons: [
            { title: "სუნთქვის ორგანოები" },

            { title: "ფილტვების მუშაობა" },

            { title: "აირთა ცვლა" },
          ],
        },
      ];

      const FREE_LESSONS = 3;

      const GUEST_LESSON_URL = "guest-biology-lesson.html";

      const STORAGE_KEY =
        "aiia_guest_biology_progress_" +
        (new URLSearchParams(location.search).get("grade") || "7");

      const params = new URLSearchParams(location.search);

      const grade = params.get("grade") || "7";

      const gradeNames = {
        5: "V",

        6: "VI",

        7: "VII",

        8: "VIII",

        9: "IX",

        10: "X",

        11: "XI",

        12: "XII",
      };

      document.getElementById("gradeLabel").textContent =
        (gradeNames[grade] || "VII") + " კლასი";

      let selected = 0;

      function readProgress() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

          return {
            completed: Array.isArray(stored.completed) ? stored.completed : [],

            xp: Number.isFinite(stored.xp) ? stored.xp : 0,
          };
        } catch {
          return { completed: [], xp: 0 };
        }
      }

      function saveProgress(progress) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      }

      /*

      Called when a free lesson is completed.

      Example: markGuestLessonComplete(0, 0, 20)

    */

      function markGuestLessonComplete(
        chapterIndex,

        lessonIndex,

        earnedXP = 20,
      ) {
        if (
          chapterIndex !== 0 ||
          lessonIndex < 0 ||
          lessonIndex >= FREE_LESSONS
        ) {
          return;
        }

        const progress = readProgress();

        const id = chapterIndex + "-" + lessonIndex;

        if (!progress.completed.includes(id)) {
          progress.completed.push(id);

          progress.xp += Math.max(0, earnedXP);

          saveProgress(progress);
        }

        render();
      }

      function isCompleted(chapterIndex, lessonIndex, progress) {
        return progress.completed.includes(chapterIndex + "-" + lessonIndex);
      }

      function render() {
        const progress = readProgress();

        document.getElementById("xpValue").textContent = progress.xp + " XP";

        const chapterList = document.getElementById("chapters");

        chapterList.replaceChildren();

        chapters.forEach((chapter, i) => {
          const completed = chapter.lessons.filter((lesson, j) =>
            isCompleted(i, j, progress),
          ).length;

          const card = document.createElement("button");

          card.type = "button";

          card.className = "chapter-card" + (selected === i ? " active" : "");

          const number = document.createElement("span");

          number.className = "chapter-number";

          number.textContent = i + 1;

          const count = document.createElement("span");

          count.className = "chapter-count";

          count.textContent = completed + "/" + chapter.lessons.length;

          const name = document.createElement("span");

          name.className = "chapter-name";

          name.textContent = chapter.name;

          card.append(number, count, name);

          card.onclick = () => {
            selected = i;

            render();
          };

          chapterList.append(card);
        });

        const upcoming = document.createElement("div");

        upcoming.className = "chapter-card chapter-upcoming";

        upcoming.style.setProperty("background-color", "#ffffff", "important");

        upcoming.style.setProperty("opacity", "1", "important");

        upcoming.setAttribute("aria-label", "თავი 3 — მალე დაემატება");

        upcoming.innerHTML =
          '<span class="chapter-number">3</span>' +
          '<span class="chapter-name">მალე დაემატება</span>';

        chapterList.append(upcoming);

        const current = chapters[selected];

        document.getElementById("selected-title").textContent = current.name;

        document.getElementById("selected-number").textContent =
          "თავი " + (selected + 1);

        const list = document.getElementById("lessons");

        list.replaceChildren();

        current.lessons.forEach((lesson, i) => {
          const unlocked = selected === 0 && i < FREE_LESSONS;

          const completed = isCompleted(selected, i, progress);

          const item = document.createElement(unlocked ? "a" : "button");

          item.className = "lesson" + (unlocked ? "" : " locked");

          if (unlocked) {
            item.href =
              GUEST_LESSON_URL +
              "?grade=" +
              encodeURIComponent(grade) +
              "&chapter=" +
              selected +
              "&lesson=" +
              i;
          } else {
            item.type = "button";

            item.onclick = openRegister;

            item.setAttribute(
              "aria-label",

              lesson.title + " — რეგისტრაცია საჭიროა",
            );
          }

          const index = document.createElement("span");

          index.className = "lesson-index";

          index.textContent = selected + 1 + "." + (i + 1);

          const title = document.createElement("span");

          title.className = "lesson-title";

          title.textContent = lesson.title;

          const status = document.createElement("span");

          if (unlocked) {
            status.className = "status " + (completed ? "done" : "");

            status.setAttribute(
              "aria-label",

              completed ? "დასრულებული" : "დასაწყები",
            );
          } else {
            status.className = "lock-icon";

            status.innerHTML =
              '<svg viewBox="0 0 24 24" fill="none" ' +
              'stroke="currentColor" stroke-width="1.8">' +
              '<rect x="5" y="10" width="14" height="11" rx="2"/>' +
              '<path d="M8 10V7a4 4 0 0 1 8 0v3"/>' +
              "</svg>";
          }

          const chevron = document.createElement("span");

          chevron.className = "chevron";

          chevron.textContent = "›";

          item.append(index, title, status, chevron);

          list.append(item);
        });

        const allLessons = chapters.flatMap((chapter) => chapter.lessons);

        const done = progress.completed.filter((id) =>
          ["0-0", "0-1", "0-2"].includes(id),
        ).length;

        const pct = allLessons.length
          ? Math.round((done / allLessons.length) * 100)
          : 0;

        document.getElementById("progress-ring").textContent = pct + "%";

        document.getElementById("progress-text").textContent =
          done + "/" + allLessons.length + " დასრულებული";

        document.getElementById("progress-fill").style.width = pct + "%";
      }

      function openRegister() {
        document.getElementById("registerModal").classList.add("show");
      }

      function closeRegister(event) {
        if (event && event.target !== event.currentTarget) return;

        document.getElementById("registerModal").classList.remove("show");
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          document.getElementById("registerModal").classList.remove("show");
        }
      });

      render();
    </script>
  </body>
</html>
