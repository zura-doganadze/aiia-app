<!doctype html>

<html lang="ka">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />

    <title>AIIA • მოსწავლის დამატება</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --purple: #6153ff;

        --dark: #171b40;

        --muted: #8c91b1;

        --line: #e9eafa;

        --green: #12b7a1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        background: #f7f8ff;

        color: var(--dark);

        font-family: "Noto Sans Georgian", sans-serif;

        font-size: 12px;
      }

      .shell {
        width: 100%;

        max-width: 440px;

        min-height: 100dvh;

        margin: auto;

        background: #fff;

        box-shadow: 0 0 35px #343c8b0a;

        display: flex;

        flex-direction: column;

        padding: 16px 16px max(20px, env(safe-area-inset-bottom));
      }

      .top {
        display: flex;

        align-items: center;

        gap: 12px;

        margin-bottom: 32px;
      }

      .back {
        width: 29px;

        height: 29px;

        border: 0;

        border-radius: 50%;

        background: #f0f0ff;

        color: #252958;

        font-size: 22px;

        cursor: pointer;
      }

      .progress {
        flex: 1;

        height: 4px;

        border-radius: 8px;

        background: #e4e2ff;

        overflow: hidden;
      }

      .fill {
        width: 50%;

        height: 100%;

        background: var(--purple);

        border-radius: 8px;

        transition: width 0.25s;
      }

      .step {
        color: #9398c1;

        font-size: 10px;

        white-space: nowrap;
      }

      .screen {
        display: none;

        flex: 1;

        flex-direction: column;
      }

      .screen.active {
        display: flex;
      }

      h1 {
        font-size: 18px;

        line-height: 1.55;

        margin: 0 0 24px;

        font-weight: 800;
      }

      h2 {
        font-size: 16px;

        line-height: 1.55;

        margin: 0 0 22px;

        font-weight: 800;
      }

      .field {
        margin-bottom: 19px;
      }

      .field label,
      .field-title {
        display: block;

        font-size: 11px;

        font-weight: 700;

        margin-bottom: 8px;
      }

      .field small {
        display: block;

        color: #959bb9;

        font-size: 10px;

        margin-top: 7px;

        line-height: 1.5;
      }

      .input-wrap {
        position: relative;
      }

      input,
      select {
        width: 100%;

        height: 44px;

        border: 1px solid var(--line);

        border-radius: 11px;

        background: #fff;

        padding: 0 12px;

        color: #252b58;

        font:
          600 12px "Noto Sans Georgian",
          sans-serif;

        outline: none;
      }

      input:focus,
      select:focus {
        border-color: #8a80ff;

        box-shadow: 0 0 0 3px #6357ff12;
      }

      input::placeholder {
        color: #a9adc6;

        font-weight: 400;
      }

      select {
        appearance: none;

        color: #757db1;

        padding-right: 32px;
      }

      .chevron {
        position: absolute;

        right: 12px;

        top: 11px;

        color: #9ca1d6;

        font-size: 19px;

        pointer-events: none;
      }

      .gender {
        display: flex;

        gap: 8px;
      }

      .gender label {
        flex: 1;

        cursor: pointer;

        margin: 0;
      }

      .gender input {
        position: absolute;

        opacity: 0;

        width: 1px;

        height: 1px;
      }

      .gender span {
        display: flex;

        align-items: center;

        justify-content: space-between;

        border: 1px solid var(--line);

        border-radius: 10px;

        height: 40px;

        padding: 0 12px;

        font-weight: 600;
      }

      .gender i {
        width: 15px;

        height: 15px;

        border: 1.5px solid #c6c8ec;

        border-radius: 50%;

        display: block;
      }

      .gender input:checked + span {
        border-color: #afa7ff;

        background: #f5f3ff;

        color: var(--purple);
      }

      .gender input:checked + span i {
        border: 4px solid #fff;

        background: var(--purple);

        box-shadow: 0 0 0 1px var(--purple);
      }

      .spacer {
        flex: 1;

        min-height: 25px;
      }

      .primary,
      .secondary {
        width: 100%;

        min-height: 46px;

        border: 0;

        border-radius: 24px;

        font:
          700 12px "Noto Sans Georgian",
          sans-serif;

        cursor: pointer;
      }

      .primary {
        color: #fff;

        background: linear-gradient(100deg, #5a54f9, #5b48ff);

        box-shadow: 0 6px 13px #6353ff25;
      }

      .secondary {
        color: var(--purple);

        background: white;

        border: 1px solid #d9d4ff;

        margin-top: 12px;
      }

      .arrow {
        font-size: 17px;

        margin-left: 7px;

        vertical-align: -1px;
      }

      .iconlabel {
        display: flex !important;

        align-items: center;

        gap: 7px;
      }

      .iconlabel svg {
        width: 15px;

        height: 15px;

        stroke: #343a74;

        fill: none;

        stroke-width: 1.7;
      }

      .eye {
        position: absolute;

        right: 11px;

        top: 10px;

        border: 0;

        background: none;

        color: #959bc4;

        cursor: pointer;

        font-size: 18px;
      }

      .valid {
        position: absolute;

        right: 12px;

        top: 11px;

        color: #0db49d;

        font-size: 18px;
      }

      .help {
        display: flex;

        gap: 7px;

        align-items: flex-start;

        color: #999db8;

        font-size: 10px;

        line-height: 1.55;

        margin-top: 7px;
      }

      .help.success {
        color: #0aa991;
      }

      .error {
        color: #db4262;

        font-size: 11px;

        margin: 7px 0 0;

        min-height: 0;
      }

      .success-top {
        text-align: center;

        padding-top: 12px;
      }

      .confetti {
        position: relative;

        width: 128px;

        height: 105px;

        margin: 0 auto 12px;
      }

      .circle-outer {
        width: 98px;

        height: 98px;

        background: #edfcf7;

        border-radius: 50%;

        display: grid;

        place-items: center;

        margin: auto;
      }

      .circle-inner {
        width: 67px;

        height: 67px;

        background: #32d4a4;

        border-radius: 50%;

        display: grid;

        place-items: center;

        color: #fff;

        font-size: 43px;

        font-weight: 800;
      }

      .sprinkle {
        position: absolute;

        width: 5px;

        height: 12px;

        border-radius: 3px;

        background: #a67cff;

        transform: rotate(-40deg);
      }

      .sprinkle:nth-child(2) {
        left: 1px;

        top: 32px;

        background: #38d7b0;

        transform: rotate(62deg);
      }

      .sprinkle:nth-child(3) {
        right: 0;

        top: 35px;

        background: #fa609e;

        transform: rotate(45deg);
      }

      .sprinkle:nth-child(4) {
        left: 20px;

        bottom: 4px;

        background: #ffc44c;

        transform: rotate(40deg);
      }

      .sprinkle:nth-child(5) {
        right: 20px;

        bottom: 6px;

        background: #9c72f7;

        transform: rotate(-45deg);
      }

      .success-top h1 {
        font-size: 18px;

        line-height: 1.35;

        margin: 0 0 20px;
      }

      .info-card {
        display: flex;

        align-items: flex-start;

        gap: 9px;

        background: #f5f3ff;

        border: 1px solid #e5e0ff;

        color: #494274;

        border-radius: 11px;

        padding: 12px;

        font-size: 11px;

        line-height: 1.65;

        margin: -8px 0 21px;
      }

      .info-card svg {
        width: 17px;
        height: 17px;
        flex: none;
        color: var(--purple);
        margin-top: 1px;
      }

      .credentials-heading {
        font-size: clamp(10px, 2.8vw, 13px);
        white-space: nowrap;
        letter-spacing: -0.25px;
      }

      .student-info-card {
        margin-bottom: 8px;
      }

      .student-info-card .profile {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .credential-card {
        margin-bottom: 8px;
        padding: 10px 13px;
      }

      .credential-card .credential {
        min-height: 34px;
      }

      .credential-card .cred-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        flex: none;
      }

      .credential-card .cred-icon svg {
        width: 17px;
        height: 17px;
        stroke: #343a74;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .credential-card .copy {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        flex: none;
      }

      .credential-card .copy svg {
        width: 18px;
        height: 18px;
        stroke: var(--purple);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .credential-card .cred-data small {
        line-height: 1.3;
      }

      .credential-card .cred-data strong {
        display: block;
        line-height: 1.5;
      }

      .credential-card .credential {
        padding-top: 0;
      }

      .student-card {
        background: #fafaff;

        border: 1px solid #e9eafa;

        border-radius: 12px;

        padding: 13px 14px;
      }

      .profile {
        display: flex;

        align-items: center;

        gap: 10px;

        padding-bottom: 13px;

        border-bottom: 1px solid #e7e8f4;
      }

      .avatar {
        width: 40px;

        height: 40px;

        border-radius: 50%;

        background: #e6e3ff;

        display: grid;

        place-items: center;

        font-size: 24px;
      }

      .profile strong {
        display: block;

        font-size: 12px;
      }

      .profile small {
        color: #8d93b5;

        font-size: 10px;
      }

      .credential {
        display: flex;

        align-items: center;

        gap: 9px;

        padding: 12px 0 0;
      }

      .credential + .credential {
        border-top: 1px solid #e7e8f4;

        margin-top: 11px;
      }

      .cred-icon {
        color: #293365;

        font-size: 19px;
      }

      .cred-data {
        flex: 1;

        min-width: 0;
      }

      .cred-data small {
        display: block;

        color: #9a9dbb;

        font-size: 10px;
      }

      .cred-data strong {
        font-size: 12px;

        overflow-wrap: anywhere;
      }

      .copy {
        border: 0;

        background: none;

        color: var(--purple);

        font-size: 19px;

        cursor: pointer;

        padding: 5px;
      }

      .note {
        font-size: 10px;

        color: #858cac;

        text-align: center;

        margin-top: 11px;

        line-height: 1.5;
      }

      .hide {
        display: none !important;
      }

      @media (min-width: 600px) {
        body {
          padding: 30px;
        }

        .shell {
          min-height: min(790px, calc(100dvh - 60px));

          border-radius: 26px;

          border: 1px solid #f0f0fa;

          padding: 22px 24px 26px;
        }
      }

      @media (max-height: 700px) {
        .top {
          margin-bottom: 20px;
        }

        h1 {
          margin-bottom: 16px;
        }

        .field {
          margin-bottom: 13px;
        }

        .shell {
          padding-top: 10px;
        }

        .success-top {
          padding-top: 0;
        }

        .confetti {
          height: 90px;

          margin-bottom: 4px;
        }

        .circle-outer {
          width: 85px;

          height: 85px;
        }

        .circle-inner {
          width: 60px;

          height: 60px;
        }
      }
    </style>
  </head>

  <body>
    <main class="shell">
      <header class="top" id="top">
        <button class="back" type="button" onclick="goBack()" aria-label="უკან">
          ‹
        </button>

        <div class="progress"><div class="fill" id="progress"></div></div>

        <span class="step" id="step">1 / 2</span>
      </header>

      <section class="screen active" id="page1">
        <h1>მოსწავლის ინფორმაცია</h1>

        <div class="field">
          <div class="field-title">სქესი</div>

          <div class="gender">
            <label
              ><input type="radio" name="gender" value="გოგო" checked /><span
                >გოგო <i></i></span></label
            ><label
              ><input type="radio" name="gender" value="ბიჭი" /><span
                >ბიჭი <i></i></span
            ></label>
          </div>
        </div>

        <div class="field">
          <label for="fullname">სახელი და გვარი</label
          ><input
            id="fullname"
            autocomplete="off"
            placeholder="მოსწავლის სახელი და გვარი"
            maxlength="80"
          />
        </div>

        <div class="field">
          <label for="grade">კლასი</label>

          <div class="input-wrap">
            <select id="grade">
              <option value="">აირჩიე კლასი</option>

              <option value="1">1 კლასი</option>

              <option value="2">2 კლასი</option>

              <option value="3">3 კლასი</option>

              <option value="4">4 კლასი</option>

              <option value="5">5 კლასი</option>

              <option value="6">6 კლასი</option>

              <option value="7">7 კლასი</option>

              <option value="8">8 კლასი</option>

              <option value="9">9 კლასი</option>

              <option value="10">10 კლასი</option>

              <option value="11">11 კლასი</option>

              <option value="12">12 კლასი</option></select
            ><span class="chevron">⌄</span>
          </div>
        </div>

        <p class="error" id="error1" role="alert"></p>

        <div class="spacer"></div>

        <button class="primary" type="button" onclick="nextOne()">
          შემდეგი <span class="arrow">→</span>
        </button>
      </section>

      <section class="screen" id="page2">
        <h2 class="credentials-heading">შექმენით მოსწავლის ლოგინი და პაროლი</h2>

        <div class="info-card">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 11v6M12 7h.01" />
          </svg>

          <span
            >მოსწავლის AIIA-ში შესასვლელად აუცილებელია შეუქმნათ მას ლოგინი და
            პაროლი.</span
          >
        </div>

        <div class="field">
          <label class="iconlabel" for="username"
            ><svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4" />

              <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
            </svg>

            ლოგინი</label
          >

          <div class="input-wrap">
            <input
              id="username"
              placeholder="მაგ: mariam123"
              autocomplete="off"
              maxlength="24"
              spellcheck="false"
            /><span class="valid hide" id="userValid">●</span>
          </div>
        </div>

        <div class="field">
          <label class="iconlabel" for="password"
            ><svg viewBox="0 0 24 24">
              <rect x="5" y="10" width="14" height="11" rx="2" />

              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>

            პაროლი</label
          >

          <div class="input-wrap">
            <input
              id="password"
              type="password"
              placeholder="შეიყვანე პაროლი"
              autocomplete="new-password"
            /><button
              class="eye"
              type="button"
              onclick="togglePass('password', this)"
              aria-label="პაროლის ჩვენება"
            >
              ◉
            </button>
          </div>

          <div class="help">ⓘ პაროლი უნდა შეიცავდეს მინიმუმ 6 სიმბოლოს.</div>
        </div>

        <div class="field">
          <label class="iconlabel" for="confirm"
            ><svg viewBox="0 0 24 24">
              <rect x="5" y="10" width="14" height="11" rx="2" />

              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>

            პაროლის გამეორება</label
          >

          <div class="input-wrap">
            <input
              id="confirm"
              type="password"
              placeholder="გაიმეორე პაროლი"
              autocomplete="new-password"
            /><button
              class="eye"
              type="button"
              onclick="togglePass('confirm', this)"
              aria-label="პაროლის ჩვენება"
            >
              ◉
            </button>
          </div>

          <div class="help success hide" id="match">✓ პაროლები ემთხვევა.</div>
        </div>

        <p class="error" id="error2" role="alert"></p>

        <div class="spacer"></div>

        <button class="primary" type="button" onclick="finish()">
          ანგარიშის შექმნა <span class="arrow">→</span>
        </button>
      </section>

      <section class="screen" id="page3">
        <div class="success-top">
          <div class="confetti">
            <div class="circle-outer"><div class="circle-inner">✓</div></div>

            <span class="sprinkle"></span><span class="sprinkle"></span
            ><span class="sprinkle"></span><span class="sprinkle"></span
            ><span class="sprinkle"></span>
          </div>

          <h1>მოსწავლე წარმატებით<br />დაემატა!</h1>
        </div>

        <div class="student-card student-info-card">
          <div class="profile">
            <div class="avatar" id="avatar">👧🏻</div>

            <div>
              <strong id="displayName"></strong
              ><small id="displayGrade"></small>
            </div>
          </div>
        </div>

        <div class="student-card credential-card">
          <div class="credential">
            <span class="cred-icon"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21v-2a8 8 0 0 1 16 0v2" /></svg
            ></span>

            <div class="cred-data">
              <small>ლოგინი</small><strong id="displayUser"></strong>
            </div>

            <button
              class="copy"
              type="button"
              onclick="copyValue('displayUser', this)"
              aria-label="ლოგინის კოპირება"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="8" y="8" width="12" height="12" rx="2" />
                <path
                  d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="student-card credential-card">
          <div class="credential">
            <span class="cred-icon"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10" width="14" height="11" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
            ></span>

            <div class="cred-data">
              <small>პაროლი</small><strong id="displayPass"></strong>
            </div>

            <button
              class="copy"
              type="button"
              onclick="copyValue('displayPass', this)"
              aria-label="პაროლის კოპირება"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="8" y="8" width="12" height="12" rx="2" />
                <path
                  d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="spacer"></div>

        <button
          class="primary"
          type="button"
          onclick="location.href = 'parent-home.html'"
        >
          მთავარ გვერდზე გადასვლა <span class="arrow">→</span></button
        ><button class="secondary" type="button" onclick="resetForm()">
          კიდევ ერთი მოსწავლის დამატება ⊕
        </button>
      </section>
    </main>

    <script>
      "use strict";

      let current = 1;

      const el = (id) => document.getElementById(id);

      const val = (id) => el(id).value.trim();

      function show(n) {
        current = n;

        [1, 2, 3].forEach((i) =>
          el("page" + i).classList.toggle("active", i === n),
        );

        el("top").classList.toggle("hide", n === 3);

        el("progress").style.width = n === 1 ? "50%" : "100%";

        el("step").textContent = n === 1 ? "1 / 2" : "2 / 2";

        window.scrollTo(0, 0);
      }

      function goBack() {
        if (current === 2) show(1);
        else if (current === 1) location.href = "parent-auth.html";
        else location.href = "parent-home.html";
      }

      function nextOne() {
        // DEMO: ველების შევსება სავალდებულო არ არის.

        el("error1").textContent = "";

        show(2);
      }

      function togglePass(id, btn) {
        const field = el(id);

        field.type = field.type === "password" ? "text" : "password";

        btn.setAttribute(
          "aria-label",

          field.type === "password" ? "პაროლის ჩვენება" : "პაროლის დამალვა",
        );
      }

      function finish() {
        // DEMO: ცარიელი ველების შემთხვევაში გამოიყენება სატესტო მონაცემები.

        el("error2").textContent = "";

        const name = val("fullname") || "მარიამ დევდარიანი";

        const grade = val("grade") || "7";

        const username = val("username") || "mariam123";

        const password = el("password").value || "Aiia2024!";

        el("displayName").textContent = name;

        el("displayGrade").textContent = grade + "-ე კლასი";

        el("displayUser").textContent = username;

        el("displayPass").textContent = password;

        el("avatar").textContent =
          document.querySelector('input[name="gender"]:checked').value ===
          "გოგო"
            ? "👧🏻"
            : "👦🏻";

        show(3);
      }

      function resetForm() {
        ["fullname", "username", "password", "confirm"].forEach(
          (id) => (el(id).value = ""),
        );

        el("grade").value = "";

        document.querySelector('input[name="gender"][value="გოგო"]').checked =
          true;

        el("match").classList.add("hide");

        el("userValid").classList.add("hide");

        el("error1").textContent = "";

        el("error2").textContent = "";

        el("displayPass").textContent = "";

        show(1);
      }

      async function copyValue(id, button) {
        try {
          await navigator.clipboard.writeText(el(id).textContent);

          const old = button.innerHTML;

          button.textContent = "✓";

          setTimeout(() => (button.innerHTML = old), 1500);
        } catch (e) {
          const old = button.innerHTML;

          button.textContent = "!";

          setTimeout(() => (button.innerHTML = old), 1500);
        }
      }

      el("confirm").addEventListener("input", () =>
        el("match").classList.toggle(
          "hide",

          !el("confirm").value || el("confirm").value !== el("password").value,
        ),
      );

      el("password").addEventListener("input", () =>
        el("match").classList.toggle(
          "hide",

          !el("confirm").value || el("confirm").value !== el("password").value,
        ),
      );

      el("username").addEventListener("input", () =>
        el("userValid").classList.toggle(
          "hide",

          !/^[a-zA-Z0-9._]{4,24}$/.test(val("username")),
        ),
      );

      // სატესტო ვერსია: ნაჩვენები ანგარიში მხოლოდ ეკრანზე იქმნება; სერვერზე არ ინახება.
    </script>
  </body>
</html>
