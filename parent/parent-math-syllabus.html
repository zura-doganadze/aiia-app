<!doctype html>

<html lang="ka">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AIIA — მათემატიკის სილაბუსი</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #6c63ff;

        --secondary: #4a90ff;

        --success: #22c55e;

        --text: #202338;

        --muted: #8990a2;

        --line: #e8e6f1;

        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        min-height: 100vh;

        background: #ffffff;

        color: var(--text);

        font-family: "Noto Sans Georgian", Arial, sans-serif;
      }

      button,
      a {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      a {
        color: inherit;

        text-decoration: none;
      }

      svg {
        display: block;
      }

      .app {
        width: 100%;

        max-width: 950px;

        margin: 0 auto;

        padding: 14px 17px 115px;
      }

      /* HEADER */

      .header {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 12px;

        margin-bottom: 10px;
      }

      .menu {
        width: 46px;

        height: 46px;

        flex: 0 0 46px;

        border: 0;

        background: white;

        border-radius: 19px;

        box-shadow: 0 3px 16px #2632580a;

        display: grid;

        place-items: center;
      }

      .header-title {
        flex: 1;

        min-width: 0;
      }

      .header-title h1 {
        font-size: 20px;

        margin: 0 0 2px;

        font-weight: 800;
      }

      .header-title p {
        font-size: 12px;

        color: #7776ad;

        margin: 0;
      }

      /* PROGRESS */

      /* CHAPTERS */

      .section-top {
        display: flex;

        justify-content: space-between;

        align-items: center;

        gap: 8px;

        margin: 17px 0 9px;
      }

      .section-top h2 {
        font-size: 18px;

        margin: 0;

        font-weight: 800;
      }

      .all {
        border: 0;

        background: none;

        color: #7776ad;

        font-size: 12px;

        font-weight: 700;

        padding: 4px 0;
      }

      .chapters {
        display: flex;

        gap: 10px;

        overflow-x: auto;

        padding: 2px 1px 0;

        margin-bottom: 16px;

        scrollbar-width: none;
      }

      .chapters::-webkit-scrollbar {
        display: none;
      }

      .chapter-card {
        flex: 0 0 clamp(124px, 39vw, 146px);

        height: 124px;

        text-align: left;

        position: relative;

        border-radius: 22px;

        padding: 10px 12px;

        background: #f3f1ff;

        color: #5650bb;

        border: 1px solid #e9e5ff;

        transition:
           background  0.2s,
          color 0.2s,
          transform 0.2s;
      }

      .chapter-upcoming {
        opacity: 0.75;

        cursor: default;
      }

      .chapter-card.active {
        background: linear-gradient(135deg, #6766f5, #4c48d9);

        color: white;

        border-color: transparent;

        box-shadow: 0 8px 15px #5b58c629;
      }

      button.chapter-card:active {
        transform: scale(0.98);
      }

      .chapter-number {
        position: absolute;

        top: 14px;

        left: 11px;

        width: 30px;

        height: 30px;

        border-radius: 50%;

        background: #e2dfff;

        color: #615de6;

        display: grid;

        place-items: center;

        font-weight: 800;

        font-size: 14px;
      }

      .chapter-card.active .chapter-number {
        background: white;

        color: #615de6;
      }

      .chapter-count {
        position: absolute;

        right: 11px;

        top: 18px;

        font-size: 13px;

        font-weight: 800;
      }

      .chapter-name {
        position: absolute;

        bottom: 10px;

        left: 11px;

        right: 12px;

        font-size: 15px;

        line-height: 1.4;

        font-weight: 800;
      }

      /* LESSONS */

      .lesson-panel {
        border: 1px solid #e9e6f3;

        border-radius: 25px;

        padding: 12px 7px;

        background: #faf9ff;
      }

      .lesson-heading {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 10px;

        margin: 0 4px 17px;
      }

      .lesson-heading h2 {
        display: flex;

        align-items: center;

        gap: 10px;

        font-size: 18px;

        line-height: 1.4;

        margin: 0;

        font-weight: 800;

        min-width: 0;
      }

      .lesson-heading h2::before {
        content: "";

        display: block;

        width: 4px;

        height: 27px;

        border-radius: 5px;

        background: #6259e5;

        flex: 0 0 4px;
      }

      .chapter-tag {
        color: #7876ae;

        font-size: 12px;

        font-weight: 800;

        white-space: nowrap;
      }

      .lessons {
        display: flex;

        flex-direction: column;

        gap: 8px;
      }

      .lesson {
        width: 100%;

        display: flex;

        align-items: center;

        gap: 9px;

        min-height: 65px;

        padding: 9px 10px;

        background: white;

        border: 1px solid #e5e3ee;

        border-radius: 21px;

        text-align: left;
      }

      .lesson-index {
        font-weight: 800;

        font-size: 14px;

        flex: 0 0 38px;
      }

      .lesson-title {
        font-weight: 800;

        font-size: 15px;

        line-height: 1.45;

        flex: 1;

        min-width: 0;
      }

      .status {
        width: 27px;

        height: 27px;

        border-radius: 50%;

        background: #a1aabc;

        flex: 0 0 27px;
      }

      .status.in-progress {
        background: #ffa331;
      }

      .status.done {
        background: #22c55e;
      }

      .chevron {
        font-size: 27px;

        line-height: 1;

        color: #8d94a6;

        flex: none;
      }

      /* BOTTOM NAVIGATION — SAME AS STUDENT HOME */

      /* PARENT SYLLABUS */

      .app {
        padding-bottom: 42px;
      }

      .header {
        border-bottom: 1px solid #e8e6f1;
        padding-bottom: 14px;
        margin-bottom: 18px;
      }

      .menu {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        border: 1px solid #e8e6f1;
        border-radius: 12px;
        box-shadow: none;
        color: #6c63ff;
      }

      .header-title h1 {
        font-size: 21px;
      }

      .header-title p {
        font-size: 12px;
      }

      .lesson {
        cursor: default;
      }

      .lesson-index {
        color: #6c63ff;
      }

      .chapter-card {
        cursor: pointer;
      }

      @media (max-width: 360px) {
        .app {
          padding-left: 12px;
          padding-right: 12px;
        }
        .lesson-title {
          font-size: 13px;
        }
      }

      @media (min-width: 700px) {
        .app {
          padding: 28px 28px 55px;
        }
        .chapters {
          gap: 16px;
        }
        .chapter-card {
          flex-basis: 190px;
          height: 138px;
        }
        .lesson-panel {
          padding: 16px 12px;
        }
        .lesson {
          min-height: 72px;
        }
      }

      :focus-visible {
        outline: 3px solid var(--secondary);
        outline-offset: 3px;
      }
    </style>
  </head>

  <body>
    <main class="app">
      <header class="header">
        <a
          class="menu"
          href="parent-subject-math.html"
          aria-label="უკან დაბრუნება"
        >
          <svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </a>

        <div class="header-title">
          <h1>სასწავლო პროგრამა</h1>
          <p>მათემატიკა · V კლასი</p>
        </div>
      </header>

      <div class="section-top"><h2>თავები</h2></div>

      <div class="chapters" id="chapters"></div>

      <section class="lesson-panel">
        <div class="lesson-heading">
          <h2 id="selected-title"></h2>
          <span class="chapter-tag" id="selected-number"></span>
        </div>

        <div class="lessons" id="lessons"></div>
      </section>
    </main>

    <script>
      const chapters = [
        {
          name: "ნატურალური რიცხვები",
          lessons: [
            "ნატურალური რიცხვები",
            "რიცხვის თანრიგი და კლასები",
            "ნატურალური რიცხვების დამრგვალება",
          ],
        },

        {
          name: "რიცხვებზე მოქმედებები",
          lessons: [
            "ნატურალური რიცხვების შეკრება",
            "ნატურალური რიცხვების გამოკლება",
            "ნატურალური რიცხვების გამრავლება",
          ],
        },
      ];

      let selected = 0;

      function render() {
        const chapterList = document.getElementById("chapters");

        chapterList.replaceChildren();

        chapters.forEach((chapter, i) => {
          const card = document.createElement("button");

          card.type = "button";

          card.className = "chapter-card" + (selected === i ? " active" : "");

          card.setAttribute("aria-pressed", String(selected === i));

          const number = document.createElement("span");
          number.className = "chapter-number";
          number.textContent = i + 1;

          const count = document.createElement("span");
          count.className = "chapter-count";
          count.textContent = chapter.lessons.length + " თემა";

          const name = document.createElement("span");
          name.className = "chapter-name";
          name.textContent = chapter.name;

          card.append(number, count, name);

          card.onclick = () => {
            selected = i;
            render();
          };

          chapterList.append(card);
        });

        const upcoming = document.createElement("div");

        upcoming.className = "chapter-card chapter-upcoming";

        upcoming.setAttribute("aria-label", "თავი 3 — მალე დაემატება");

        upcoming.innerHTML =
          '<span class="chapter-number">3</span><span class="chapter-name">მალე დაემატება</span>';

        chapterList.append(upcoming);

        const current = chapters[selected];

        document.getElementById("selected-title").textContent = current.name;

        document.getElementById("selected-number").textContent =
          "თავი " + (selected + 1);

        const list = document.getElementById("lessons");
        list.replaceChildren();

        current.lessons.forEach((lesson, i) => {
          const item = document.createElement("div");
          item.className = "lesson";

          const index = document.createElement("span");
          index.className = "lesson-index";
          index.textContent = selected + 1 + "." + (i + 1);

          const title = document.createElement("span");
          title.className = "lesson-title";
          title.textContent = lesson;

          item.append(index, title);
          list.append(item);
        });
      }

      render();
    </script>
  </body>
</html>
