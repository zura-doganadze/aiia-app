<!doctype html>

<html lang="ka">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AIIA — მშობლის მთავარი</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --purple: #6c63ff;

        --ink: #111827;

        --muted: #6b7280;

        --line: #f8fafc;

        --bg: #ffffff;
      }

      \* {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        background: var(--bg);

        font-family: "Noto Sans Georgian", sans-serif;

        color: var(--ink);
      }

      button {
        font: inherit;

        cursor: pointer;
      }

      .app {
        max-width: 460px;

        min-height: 100dvh;

        margin: auto;

        background: #ffffff;

        padding: 22px 15px 100px;

        position: relative;
      }

      .top {
        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 23px;
      }

      .brand {
        font-weight: 800;

        font-size: 28px;

        letter-spacing: -1px;
      }

      .brand i {
        font-style: normal;

        color: #6c63ff;

        margin-right: 7px;
      }

      .bell {
        width: 42px;

        height: 42px;

        border: 1px solid var(--line);

        border-radius: 14px;

        background: #fff;

        position: relative;

        display: grid;

        place-items: center;

        color: #505a82;
      }

      .dot {
        position: absolute;

        width: 9px;

        height: 9px;

        background: #ff4d4f;

        border-radius: 50%;

        right: 10px;

        top: 8px;
      }

      .student {
        display: flex;

        align-items: center;

        width: 100%;

        text-align: left;

        gap: 12px;

        padding: 11px 14px;

        background: #EFF0F4;

        border: 1px solid var(--line);

        border-radius: 17px;

        box-shadow: 0 5px 16px #303d8a0b;
      }

      .avatar {
        height: 49px;

        width: 49px;

        display: grid;

        place-items: center;

        border-radius: 50%;

        background: #eae5ff;

        font-size: 29px;

        overflow: hidden;

        flex: none;
      }

      .avatar img {
        width: 100%;

        height: 100%;

        object-fit: cover;

        display: block;
      }

      .student strong {
        font-size: 14px;

        display: block;
      }

      .student small {
        display: block;

        color: var(--muted);

        font-size: 12px;

        margin-top: 2px;
      }

      .chev {
        margin-left: auto;

        color: #737eab;
      }

      .student-menu {
        display: none;

        background: white;

        border: 1px solid var(--line);

        border-radius: 12px;

        margin-top: 7px;

        padding: 9px 12px;

        font-size: 12px;

        color: var(--muted);
      }

      .student-menu.show {
        display: block;
      }

      h2 {
        font-size: 17px;

        margin: 25px 2px 13px;
      }

      .subject {
        background: #fff;

        border: 1px solid var(--line);

        border-radius: 19px;

        padding: 0;

        margin-bottom: 13px;

        overflow: hidden;

        box-shadow: 0 5px 16px #303d8a09;
      }

      .subject-head {
        display: flex;

        align-items: center;

        gap: 11px;

        width: 100%;

        border: 0;

        background: #EFF0F4;

        text-align: left;

        padding: 14px 12px;

        color: inherit;
      }

      .subject-icon {
        height: 48px;

        width: 48px;

        flex: none;

        border-radius: 13px;

        display: grid;

        place-items: center;

        color: #fff;
      }

      .math {
        background: #6c63ff;
      }

      .bio {
        background: #22c55e;
      }

      .chem {
        background: #f59e0b;
      }

      .physics {
        background: #4a90ff;
      }

      .soon {
        margin-left: auto;

        font-size: 11px;

        font-weight: 700;

        color: #7b82a1;

        background: #fff;

        border-radius: 20px;

        padding: 6px 10px;

        white-space: nowrap;
      }

      .upcoming .subject-head {
        background: #EFF0F4;
      }

      .upcoming .subject-title strong {
        color: #6e7490;
      }

      .upcoming .subject-icon {
        opacity: 0.7;
      }

      .subject-main {
        flex: 1;

        min-width: 0;
      }

      .subject-title {
        display: flex;

        justify-content: space-between;

        align-items: center;

        gap: 8px;
      }

      .subject-title strong {
        font-size: 14px;
      }

      .count {
        font-size: 12px;

        white-space: nowrap;

        font-weight: 700;
      }

      .track {
        margin-top: 11px;

        background: #e7e9f2;

        height: 7px;

        border-radius: 20px;

        overflow: hidden;
      }

      .fill {
        height: 100%;

        background: #6c63ff;

        border-radius: 20px;
      }

      .fill.bio-fill {
        background: #22c55e;
      }

      .expand {
        margin-left: 1px;

        color: #7881a4;

        transition: transform 0.2s;
      }

      .subject[aria-expanded="true"] .expand {
        transform: rotate(180deg);
      }

      .details {
        border-radius: 18px;

        display: grid;

        grid-template-columns: minmax(0, 1fr);

        gap: 9px;

        margin: 0;

        padding: 12px;

        background: #fff;

        border-top: 1px solid #e7e4f6;
      }

      .details[hidden] {
        display: none;
      }

      .stat {
        display: flex;

        align-items: center;

        gap: 12px;

        border-radius: 14px;

        padding: 13px 14px;

        text-align: left;

        min-width: 0;
      }

      .stat svg {
        width: 22px;

        height: 22px;

        flex: none;

        display: block;

        margin: 0;
      }

      .stat span {
        display: block;

        flex: 1;

        min-width: 0;

        font-size: 14px;

        font-weight: 500;

        color: var(--text-secondary);

        line-height: 1.5;
      }

      .stat b {
        display: block;

        flex: none;

        font-size: 14px;

        font-weight: 700;

        margin: 0;

        white-space: nowrap;
      }

      .done {
        background: #effbf5;
      }

      .done svg,
      .done b {
        color: #22c55e;
      }

      .review {
        background: #fff6e9;
      }

      .review svg,
      .review b {
        color: #f59e0b;
      }

      .pending {
        background: #f3f3fc;
      }

      .pending svg,
      .pending b {
        color: #69738e;
      }

      .nav {
        position: fixed;

        bottom: 0;

        left: 50%;

        transform: translateX(-50%);

        width: min(460px, 100%);

        background: #fff;

        border-top: 1px solid var(--line);

        display: grid;

        grid-template-columns: repeat(3, 1fr);

        padding: 11px 4px max(13px, env(safe-area-inset-bottom));

        box-shadow: 0 -5px 20px #2b2d7509;
      }

      .nav a {
        display: flex;

        align-items: center;

        flex-direction: column;

        gap: 4px;

        text-decoration: none;

        color: #626d92;

        font-size: 11px;
      }

      .nav a.active {
        color: var(--purple);

        font-weight: 800;
      }

      .nav svg {
        width: 22px;

        height: 22px;
      }

      .nav a.active:after {
        content: "";

        width: 23px;

        height: 3px;

        border-radius: 5px;

        background: var(--purple);
      }

      @media (min-width: 700px) {
        .app {
          box-shadow: 0 0 35px #19236615;
        }
      }

      /* AIIA Color & Typography System v1.0 */

      :root {
        --primary: #6c63ff;

        --secondary: #4a90ff;

        --achievement: #f59e0b;

        --success: #22c55e;

        --error: #ff4d4f;

        --text-primary: #111827;

        --text-secondary: #6b7280;

        --surface: #EFF0F4;

        --font-h1: 28px;

        --font-h2: 24px;

        --font-h3: 20px;

        --font-title: 18px;

        --font-body-large: 16px;

        --font-body: 14px;

        --font-label: 14px;

        --font-caption: 12px;
      }

      .brand {
        font-weight: 700;
      }

      h2 {
        font-size: var(--font-h3);
        font-weight: 600;
        color: var(--text-primary);
      }

      .student strong,
      .subject-title strong {
        font-size: var(--font-body);
        font-weight: 600;
        color: var(--text-primary);
      }

      .student small,
      .count,
      .student-menu {
        font-size: var(--font-caption);
        color: var(--text-secondary);
      }

      .subject-head,
      .student {
        background: var(--surface);
      }

      .subject {
        border-color: var(--surface);
      }

      .subject:has(.math) {
        border-color: var(--primary);
      }

      .subject:has(.bio) {
        border-color: var(--success);
      }

      .subject:has(.chem) {
        border-color: var(--achievement);
      }

      .subject:has(.physics) {
        border-color: var(--secondary);
      }

      .upcoming .subject-title strong {
        color: var(--text-secondary);
      }

      .nav a {
        font-size: var(--font-caption);
      }

      .nav a.active {
        font-weight: 600;
      }

      .stat span {
        font-size: var(--font-caption);
        color: var(--text-secondary);
      }

      .stat b {
        font-size: var(--font-body);
        font-weight: 600;
      }

      .soon {
        font-size: var(--font-caption);
        font-weight: 500;
        color: var(--text-secondary);
      }

      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--secondary);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .expand {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <header class="top">
        <div class="brand"><i>✦</i>AiiA</div>

        <button
          class="bell"
          aria-label="შეტყობინებები"
          onclick="location.href = 'parent-notifications.html'"
        >
          <svg
            width="23"
            height="23"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"
            /></svg
          ><span class="dot"></span>
        </button>
      </header>

      <button class="student" id="studentToggle" aria-expanded="false">
        <span class="avatar"
          ><img
            src="../img/leaderboard-luka.png"
            alt="ზურას ფოტო"
            onerror="
              this.style.display = 'none';

              this.parentElement.textContent = '👦🏻';
            " /></span
        ><span><strong>zura dogana</strong><small>მე-5 კლასი</small></span
        ><svg
          class="chev"
          width="19"
          height="19"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>

      <div class="student-menu" id="studentMenu">
        სატესტო რეჟიმი: ამჟამად დამატებულია ერთი მოსწავლე.
      </div>

      <h2>საგნების პროგრესი</h2>

      <section class="subject" aria-expanded="true">
        <button
          class="subject-head"
          aria-label="მათემატიკის სტატისტიკის გაშლა ან დაკეცვა"
          aria-expanded="true"
        >
          <span class="subject-icon math"
            ><svg
              width="29"
              height="29"
              viewBox="0 0 28 28"
              fill="none"
              stroke="white"
              stroke-width="2.3"
            >
              <rect x="3" y="3" width="9" height="9" rx="1.5" />

              <rect x="16" y="3" width="9" height="9" rx="1.5" />

              <rect x="3" y="16" width="9" height="9" rx="1.5" />

              <rect x="16" y="16" width="9" height="9" rx="1.5" />

              <path
                d="M7.5 5v5m-2.5-2.5h5M18.5 7.5h4m-17 11 4 4m0-4-4 4m13 0h4m-4-3h4"
              /></svg></span
          ><span class="subject-main"
            ><span class="subject-title"
              ><strong>მათემატიკა</strong
              ><span class="count">18 / 25 თემა</span></span
            ><span class="track" style="display: block"
              ><span
                class="fill"
                style="display: block; width: 72%"
              ></span></span></span
          ><svg
            class="expand"
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>

        <div class="details">
          <div class="stat done">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <circle cx="12" cy="12" r="10" />

              <path d="m7 12 3 3 7-7" /></svg
            ><span>დასრულებული</span><b>12 თემა</b>
          </div>

          <div class="stat review">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <circle cx="12" cy="12" r="10" />

              <path d="M7 12h10" /></svg
            ><span>გასამეორებელი</span><b>6 თემა</b>
          </div>

          <div class="stat pending">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="5" y="10" width="14" height="11" rx="2" />

              <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
            ><span>ჯერ არ დაწყებული</span><b>7 თემა</b>
          </div>
        </div>
      </section>

      <section class="subject" aria-expanded="true">
        <button
          class="subject-head"
          aria-label="ბიოლოგიის სტატისტიკის გაშლა ან დაკეცვა"
          aria-expanded="true"
        >
          <span class="subject-icon bio"
            ><svg
              width="29"
              height="29"
              viewBox="0 0 24 24"
              fill="none"
              stroke="white"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 3C10 3 4 7 4 15a6 6 0 0 0 6 6c8 0 11-8 11-18Z" />

              <path d="M3 21c4-7 8-10 14-13" /></svg></span
          ><span class="subject-main"
            ><span class="subject-title"
              ><strong>ბიოლოგია</strong
              ><span class="count">0 / 20 თემა</span></span
            ><span class="track" style="display: block"
              ><span
                class="fill bio-fill"
                style="display: block; width: 0%"
              ></span></span></span
          ><svg
            class="expand"
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>

        <div class="details">
          <div class="stat done">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <circle cx="12" cy="12" r="10" />

              <path d="m7 12 3 3 7-7" /></svg
            ><span>დასრულებული</span><b>0 თემა</b>
          </div>

          <div class="stat review">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <circle cx="12" cy="12" r="10" />

              <path d="M7 12h10" /></svg
            ><span>გასამეორებელი</span><b>0 თემა</b>
          </div>

          <div class="stat pending">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="5" y="10" width="14" height="11" rx="2" />

              <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
            ><span>ჯერ არ დაწყებული</span><b>20 თემა</b>
          </div>
        </div>
      </section>

      <section class="subject upcoming" aria-label="ქიმია — მალე დაემატება">
        <div class="subject-head">
          <span class="subject-icon chem"
            ><svg
              width="27"
              height="27"
              viewBox="0 0 24 24"
              fill="none"
              stroke="white"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M9 3h6M10 3v7l-5 8a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-8V3"
              />

              <path d="M8 15h8" /></svg></span
          ><span class="subject-main"
            ><span class="subject-title"><strong>ქიმია</strong></span></span
          ><span class="soon">🔒 მალე დაემატება</span>
        </div>
      </section>

      <section class="subject upcoming" aria-label="ფიზიკა — მალე დაემატება">
        <div class="subject-head">
          <span class="subject-icon physics"
            ><svg
              width="27"
              height="27"
              viewBox="0 0 24 24"
              fill="none"
              stroke="white"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <ellipse
                cx="12"
                cy="12"
                rx="10"
                ry="4"
                transform="rotate(45 12 12)"
              />

              <ellipse
                cx="12"
                cy="12"
                rx="10"
                ry="4"
                transform="rotate(-45 12 12)"
              />

              <circle
                cx="12"
                cy="12"
                r="2"
                fill="white"
                stroke="none"
              /></svg></span
          ><span class="subject-main"
            ><span class="subject-title"><strong>ფიზიკა</strong></span></span
          ><span class="soon">🔒 მალე დაემატება</span>
        </div>
      </section>

      <nav class="nav">
        <a class="active" href="parent-home.html"
          ><svg viewBox="0 0 24 24" fill="currentColor">
            <path d="m12 2 10 9h-3v10h-6v-7h-2v7H5V11H2z" /></svg
          >მთავარი</a
        ><a href="parent-subjects.html"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M12 6C9 4 5 4 2 5v14c4-1 7-1 10 1 3-2 6-2 10-1V5c-3-1-7-1-10 1Zm0 0v14"
            /></svg
          >საგნები</a
        ><a href="parent-profile.html"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="7" r="4" />

            <path d="M4 22v-2a8 8 0 0 1 16 0v2" /></svg
          >პროფილი</a
        >
      </nav>
    </div>

    <script>
      document.querySelectorAll(".subject:not(.upcoming)").forEach((card) => {
        const btn = card.querySelector(".subject-head");

        btn.addEventListener("click", () => {
          const open = card.getAttribute("aria-expanded") === "true";

          card.setAttribute("aria-expanded", String(!open));

          btn.setAttribute("aria-expanded", String(!open));

          card.querySelector(".details").hidden = open;
        });
      });

      const studentToggle = document.getElementById("studentToggle"),
        studentMenu = document.getElementById("studentMenu");

      studentToggle.addEventListener("click", () => {
        const show = studentMenu.classList.toggle("show");

        studentToggle.setAttribute("aria-expanded", String(show));
      });
    </script>
  </body>
</html>
