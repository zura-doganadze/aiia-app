<!doctype html>

<html lang="ka">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>AIIA | მშობლის შეტყობინებები</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap");

      :root {
        --primary: #6c63ff;
        --secondary: #4a90ff;
        --success: #22c55e;
        --warning: #f59e0b;
        --ink: #111827;
        --muted: #6b7280;
        --surface: #eff0f4;
        --line: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
        font-family: "Noto Sans Georgian", sans-serif;
        font-size: 14px;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      button:focus-visible,
      a:focus-visible,
      .notification-heading:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 3px;
      }

      .page {
        max-width: 480px;
        min-height: 100vh;
        margin: auto;
        background: #fff;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 15px 14px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }

      .back {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: #efedff;
        color: var(--primary);
        text-decoration: none;
        font-size: 27px;
        line-height: 1;
      }

      .header h1 {
        flex: 1;
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }

      .unread-badge {
        background: var(--primary);
        color: #fff;
        border-radius: 10px;
        padding: 9px 11px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      .unread-badge[hidden],
      .mark-all[hidden],
      .report-details[hidden] {
        display: none !important;
      }

      .content {
        padding: 15px 13px 32px;
      }

      .toolbar {
        display: flex;
        justify-content: flex-end;
        min-height: 28px;
        margin: 0 2px 9px;
      }

      .mark-all {
        border: 0;
        background: transparent;
        color: var(--primary);
        font-size: 12px;
        font-weight: 600;
      }

      .notification {
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        margin-bottom: 18px;
        box-shadow: 0 5px 16px rgba(17, 24, 39, 0.06);
      }

      .notification.unread {
        border-color: var(--primary);
        box-shadow: 0 5px 18px rgba(108, 99, 255, 0.15);
      }

      .notification-heading {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 16px 15px;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }

      .notification.unread .notification-heading {
        background: var(--primary);
      }

      .notification.unread .notification-title,
      .notification.unread .period {
        color: #fff;
      }

      .notification.unread .student-chip {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.5);
        color: #fff;
      }

      .mia-avatar,
      .fallback-avatar {
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: 50%;
        object-fit: cover;
        object-position: top center;
        border: 2px solid #fff;
        background: #ded9ff;
      }

      .fallback-avatar {
        display: none;
        place-items: center;
        color: var(--primary);
        font-weight: 700;
      }

      .heading-text {
        min-width: 0;
        flex: 1;
      }
      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .notification-title {
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        line-height: 1.5;
        margin: 0;
      }

      .dot {
        width: 9px;
        height: 9px;
        flex: none;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.22);
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 6px;
      }

      .student-chip {
        background: #fff;
        border: 1px solid #d9dce5;
        color: var(--primary);
        padding: 4px 9px;
        border-radius: 7px;
        font-size: 11px;
        font-weight: 600;
      }

      .period {
        font-size: 11px;
        color: var(--muted);
        font-weight: 500;
      }

      .notification-body {
        background: #fff;
        padding: 18px 15px 16px;
      }

      .summary {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .summary-icon {
        display: grid;
        place-items: center;
        width: 43px;
        height: 43px;
        flex: none;
        background: #ddfbe6;
        border-radius: 13px;
        color: var(--success);
      }

      .summary p {
        font-size: 13px;
        line-height: 1.75;
        margin: 0 0 14px;
        color: var(--ink);
      }

      .action-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 43px;
        border: 0;
        border-radius: 11px;
        background: var(--primary);
        color: #fff;
        padding: 11px 14px;
        font-size: 12px;
        font-weight: 600;
      }

      .notification:not(.unread) .action-btn {
        background: var(--secondary);
      }

      .action-btn svg {
        transition: transform 0.2s;
      }
      .action-btn[aria-expanded="true"] svg {
        transform: rotate(180deg);
      }

      .time {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 12px;
      }

      .report-details {
        border-top: 3px solid var(--primary);
        padding: 20px 14px 22px;
        background: #fff;
      }

      .notification:not(.unread) .report-details {
        border-top-color: var(--secondary);
      }

      .report-heading,
      .topic-title {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.5;
        color: var(--ink);
        margin: 0 0 15px;
      }

      .heading-icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: #e9e5ff;
        color: var(--primary);
      }

      .heading-icon svg {
        width: 20px;
        height: 20px;
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 145px;
        border-radius: 16px;
        padding: 13px 7px;
        text-align: center;
        background: var(--surface);
      }

      .stat.topics {
        background: #edeaff;
      }
      .stat.score {
        background: #e5f9eb;
      }

      .stat-icon {
        display: grid;
        place-items: center;
        margin-bottom: 2px;
      }
      .stat-icon svg {
        width: 25px;
        height: 25px;
      }

      .stat.topics .stat-icon,
      .stat.topics strong {
        color: var(--primary);
      }

      .stat.score .stat-icon,
      .stat.score strong {
        color: #15803d;
      }

      .stat strong {
        display: block;
        font-size: 38px;
        line-height: 1.15;
        font-weight: 700;
      }

      .stat span:last-child {
        font-size: 12px;
        color: var(--ink);
        font-weight: 500;
        line-height: 1.45;
      }

      .topic-title {
        margin: 22px 0 12px;
      }

      .subject-name {
        margin: 16px 0 9px;
        font-size: 14px;
        font-weight: 600;
        color: var(--primary);
      }

      .topic-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 9px;
      }

      .topic-list li {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 60px;
        border-radius: 13px;
        padding: 10px;
        background: var(--surface);
      }

      .topic-list li.needs-work-row {
        background: #fff3e2;
      }

      .topic-icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 37px;
        height: 37px;
        border-radius: 10px;
        background: #e0ecff;
        color: var(--secondary);
      }

      .topic-icon svg {
        width: 19px;
        height: 19px;
      }

      .topic-list li.needs-work-row .topic-icon {
        background: #ffe7be;
        color: #b96800;
      }

      .topic-name {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.5;
        color: var(--ink);
      }

      .topic-score {
        flex: none;
        min-width: 58px;
        text-align: center;
        padding: 9px 8px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 700;
        color: #fff;
        background: var(--success);
      }

      .topic-score.needs-work {
        background: var(--warning);
      }

      .empty {
        padding: 40px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 360px) {
        .header h1 {
          font-size: 17px;
        }
        .unread-badge {
          font-size: 10px;
          padding: 8px;
        }
        .notification-title {
          font-size: 12px;
        }
        .period {
          font-size: 10px;
        }
        .topic-name {
          font-size: 11px;
        }
        .topic-score {
          min-width: 50px;
          font-size: 14px;
        }
        .stat strong {
          font-size: 34px;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header class="header">
        <a
          class="back"
          href="./parent-home.html"
          aria-label="მთავარ გვერდზე დაბრუნება"
          >‹</a
        >

        <h1>შეტყობინებები</h1>

        <span class="unread-badge" id="badge"></span>
      </header>

      <main class="content">
        <div class="toolbar">
          <button class="mark-all" id="markAll" type="button">
            ყველას წაკითხვა
          </button>
        </div>

        <div id="list"></div>
      </main>
    </div>

    <script>
      // MVP დემო: გვერდის ხელახლა გახსნისას პირველი შეტყობინება კვლავ წაუკითხავია.

      // რეალურ პროდუქტში მონაცემები და წაკითხვის სტატუსი სერვერიდან უნდა მოვიდეს.

      const notifications = [
        {
          id: 1,

          student: "გიორგი",

          week: "26 ოქტომბერი – 1 ნოემბერი",

          time: "დღეს, 10:00",

          read: false,

          summary:
            "გიორგიმ ამ კვირაში 5 თემა გაიარა. ნახეთ, რა შედეგები აჩვენა ტესტებში.",

          subjects: [
            {
              name: "მათემატიკა",

              topics: [
                ["ნატურალური რიცხვები", 90],

                ["რიცხვების შედარება", 85],

                ["შეკრება და გამოკლება", 80],

                ["გამრავლება", 75],

                ["გაყოფა", 80],
              ],
            },
          ],
        },

        {
          id: 2,

          student: "გიორგი",

          week: "19–25 ოქტომბერი",

          time: "26 ოქტომბერი, 10:00",

          read: true,

          summary:
            "გიორგიმ გასულ კვირაში 3 თემა გაიარა. იხილეთ ტესტების შედეგები.",

          subjects: [
            {
              name: "მათემატიკა",

              topics: [
                ["გეომეტრიული ფიგურები", 70],

                ["მონაკვეთები", 80],
              ],
            },

            { name: "ბიოლოგია", topics: [["უჯრედის აგებულება", 90]] },
          ],
        },
      ];

      const list = document.getElementById("list");

      const chartIcon =
        '<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>';

      const chevron =
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

      function topicData(n) {
        return n.subjects.flatMap((s) => s.topics);
      }

      const icons = {
        bars: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M5 19v-5M12 19V9M19 19V4"/></svg>',

        layers:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 17l9 5 9-5"/></svg>',

        trophy:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M7 3h10v8a5 5 0 0 1-10 0V3ZM7 5H4v3a4 4 0 0 0 4 4m9-7h3v3a4 4 0 0 1-4 4M12 16v4m-4 1h8"/></svg>',

        book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14"/></svg>',

        calculator:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2m4 0h2m-8 4h2m4 0h2m-8 4h2m4 0h2"/></svg>',

        plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 8h9M8.5 3.5v9M14 18h7"/></svg>',

        divide:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 12h16"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>',

        multiply:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m5 5 14 14M19 5 5 19"/></svg>',
      };

      function topicIcon(name) {
        if (name.includes("გამრავლ")) return icons.multiply;

        if (name.includes("გაყოფ")) return icons.divide;

        if (name.includes("შეკრება")) return icons.plus;

        if (name.includes("შედარება")) return icons.bars;

        if (name.includes("რიცხვ")) return icons.calculator;

        return icons.book;
      }

      function buildDetails(n) {
        const topics = topicData(n),
          average = topics.length
            ? Math.round(
                topics.reduce((sum, t) => sum + t[1], 0) / topics.length,
              )
            : 0;

        const panel = document.createElement("section");

        panel.className = "report-details";

        panel.id = "report-" + n.id;

        panel.hidden = true;

        panel.innerHTML =
          '<h4 class="report-heading"><span class="heading-icon">' +
          icons.bars +
          '</span>კვირის სასწავლო შედეგები</h4><div class="stats"><div class="stat topics"><span class="stat-icon">' +
          icons.layers +
          '</span><strong></strong><span>გავლილი თემა</span></div><div class="stat score"><span class="stat-icon">' +
          icons.trophy +
          '</span><strong></strong><span>ტესტების საშუალო შედეგი</span></div></div><h4 class="topic-title"><span class="heading-icon">' +
          icons.book +
          '</span>გავლილი თემები და შედეგები</h4><div class="subjects"></div>';

        panel.querySelector(".topics strong").textContent = topics.length;

        panel.querySelector(".score strong").textContent = average + "%";

        const container = panel.querySelector(".subjects");

        n.subjects.forEach((subject) => {
          const heading = document.createElement("h5");

          heading.className = "subject-name";

          heading.textContent = subject.name;

          container.appendChild(heading);

          const ul = document.createElement("ul");

          ul.className = "topic-list";

          subject.topics.forEach(([name, score]) => {
            const li = document.createElement("li");

            if (score < 80) li.className = "needs-work-row";

            const ico = document.createElement("span");

            ico.className = "topic-icon";

            ico.innerHTML = topicIcon(name);

            const label = document.createElement("span");

            label.className = "topic-name";

            label.textContent = name;

            const result = document.createElement("span");

            result.className =
              "topic-score" + (score < 80 ? " needs-work" : "");

            result.textContent = score + "%";

            li.append(ico, label, result);

            ul.appendChild(li);
          });

          container.appendChild(ul);
        });

        return panel;
      }

      function render() {
        const unread = notifications.filter((n) => !n.read).length;

        const badge = document.getElementById("badge");

        badge.textContent = unread + " წაუკითხავი";

        badge.hidden = unread === 0;

        document.getElementById("markAll").hidden = unread === 0;

        list.replaceChildren();

        notifications.forEach((n) => {
          const card = document.createElement("article");

          card.className = "notification" + (n.read ? "" : " unread");

          const heading = document.createElement("div");

          heading.className = "notification-heading";

          heading.tabIndex = 0;

          heading.setAttribute("role", "button");

          heading.innerHTML =
            '<img class="mia-avatar" src="img/mia.png" alt="მია"><span class="fallback-avatar">მ</span><div class="heading-text"><div class="title-row"><h3 class="notification-title">ყოველკვირეული AI რეპორტი</h3></div><div class="meta"><span class="student-chip"></span><span class="period"></span></div></div>';

          heading.querySelector(".student-chip").textContent = n.student;

          heading.querySelector(".period").textContent = n.week;

          if (!n.read) {
            const dot = document.createElement("span");

            dot.className = "dot";

            heading.querySelector(".title-row").appendChild(dot);
          }

          heading.querySelector("img").addEventListener("error", (e) => {
            e.currentTarget.style.display = "none";

            heading.querySelector(".fallback-avatar").style.display = "grid";
          });

          const body = document.createElement("div");

          body.className = "notification-body";

          body.innerHTML =
            '<div class="summary"><span class="summary-icon"></span><p></p></div><button type="button" class="action-btn" aria-expanded="false" aria-controls="report-' +
            n.id +
            '"><span>სრული ანგარიშის ნახვა</span>' +
            chevron +
            '</button><span class="time"></span>';

          body.querySelector(".summary-icon").innerHTML = chartIcon;

          body.querySelector("p").textContent = n.summary;

          body.querySelector(".time").textContent = n.time;

          const details = buildDetails(n);

          const button = body.querySelector("button");

          function toggle() {
            const opening = details.hidden;

            details.hidden = !opening;

            button.setAttribute("aria-expanded", String(opening));

            button.querySelector("span").textContent = opening
              ? "ანგარიშის დახურვა"
              : "სრული ანგარიშის ნახვა";

            if (opening && !n.read) {
              n.read = true;

              card.classList.remove("unread");

              heading.querySelector(".dot")?.remove();

              const count = notifications.filter((x) => !x.read).length;

              document.getElementById("badge").textContent =
                count + " წაუკითხავი";

              document.getElementById("badge").hidden = count === 0;

              document.getElementById("markAll").hidden = count === 0;
            }
          }

          button.addEventListener("click", toggle);

          heading.addEventListener("click", toggle);

          heading.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();

              toggle();
            }
          });

          card.append(heading, body, details);

          list.appendChild(card);
        });

        if (!notifications.length) {
          list.innerHTML =
            '<div class="empty">შეტყობინებები ჯერ არ გაქვთ</div>';
        }
      }

      document.getElementById("markAll").addEventListener("click", () => {
        notifications.forEach((n) => (n.read = true));

        render();
      });

      render();
    </script>
  </body>
</html>
