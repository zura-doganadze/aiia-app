<!doctype html>

<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AIIA — პაკეტები</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6c63ff;
        --ink: #15162d;
        --muted: #737b98;
        --line: #e7e7f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
        font-family: "Noto Sans Georgian", sans-serif;
      }
      .wrap {
        max-width: 690px;
        margin: auto;
        padding: 0 16px 120px;
      }
      .head {
        height: 80px;
        display: flex;
        align-items: center;
        gap: 13px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 25px;
      }
      .back {
        width: 36px;
        height: 36px;
        border: 1px solid #e4e5f4;
        border-radius: 12px;
        background: #f8f8ff;
        color: var(--primary);
        font-size: 25px;
        cursor: pointer;
      }
      .head h1 {
        font-size: 21px;
        margin: 0;
        font-weight: 800;
      }
      .sub {
        font-size: 13px;
        color: var(--muted);
        margin: -10px 0 24px;
      }
      .packs {
        display: grid;
        gap: 17px;
      }
      .pack {
        border: 1.5px solid var(--border);
        border-radius: 20px;
        overflow: hidden;
        background: #fff;
        position: relative;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .packhead {
        background: var(--tint);
        padding: 17px 17px 15px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        cursor: pointer;
      }
      .packtitle {
        font-size: 17px;
        font-weight: 800;
        color: var(--strong);
        margin: 0;
      }
      .price {
        font-size: 25px;
        font-weight: 800;
        color: var(--strong);
        white-space: nowrap;
      }
      .unit {
        font-size: 11px;
        font-weight: 600;
        color: #6d7290;
      }
      .pill {
        font-size: 10px;
        background: var(--primary);
        color: #fff;
        padding: 5px 9px;
        border-radius: 100px;
        font-weight: 800;
        display: inline-block;
        margin-bottom: 7px;
      }
      .circle {
        width: 22px;
        height: 22px;
        border: 2px solid #b9bbd2;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        flex-shrink: 0;
        background: white;
      }
      .selected .circle {
        border-color: var(--primary);
      }
      .selected .circle:after {
        content: "";
        background: var(--primary);
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }
      .packbody {
        padding: 15px 17px 17px;
      }
      .features {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      .features li {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        font-size: 12px;
        line-height: 1.55;
      }
      .check {
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: #eeebff;
        color: var(--primary);
        font-size: 11px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .more {
        width: 100%;
        border: 0;
        border-top: 1px solid #f0eff7;
        margin-top: 13px;
        padding: 11px 0 0;
        background: transparent;
        color: #7772bb;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
      }
      .extra[hidden] {
        display: none;
      }
      .extra {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed #e8e5f7;
      }
      .footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #ffffffed;
        backdrop-filter: blur(10px);
        border-top: 1px solid #eeeef7;
        padding: 12px 16px max(13px, env(safe-area-inset-bottom));
      }
      .footerinner {
        max-width: 658px;
        margin: auto;
      }
      .cta {
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: var(--primary);
        color: #fff;
        padding: 15px;
        font-weight: 800;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 6px 16px #6c63ff35;
      }
      .note {
        font-size: 11px;
        color: #858ba3;
        text-align: center;
        margin: 7px 0 0;
      }
      .basic,
      .standard,
      .premium {
        --tint: #f0edff;
        --border: #dcd5ff;
        --strong: #5143bd;
      }
      .pack.selected {
        --tint: #dcd5ff;
        --border: #6c63ff;
        --strong: #3526ae;
        border: 2px solid #6c63ff;
        box-shadow: 0 13px 28px #6c63ff30;
        transform: translateY(-7px);
        z-index: 1;
      }
      .pack.selected .packhead {
        background: #ded8ff;
        border-bottom-color: #a99cff;
      }
      .packhead {
        border-radius: 18px 18px 0 0;
      }
      @media (min-width: 760px) {
        .packs {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          align-items: start;
        }
        .wrap {
          max-width: 1000px;
        }
        .footerinner {
          max-width: 960px;
        }
        .packhead {
          min-height: 120px;
          align-items: flex-start;
        }
        .price {
          font-size: 21px;
        }
        .features li {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <button
          class="back"
          onclick="location.href = 'parent-subject-math.html'"
          aria-label="უკან დაბრუნება"
        >
          ‹
        </button>
        <h1>პაკეტები</h1>
      </header>
      <section class="packs" id="packs"></section>
    </main>
    <footer class="footer">
      <div class="footerinner">
        <button
          class="cta"
          id="cta"
          type="button"
          onclick="window.location.href = 'parent-subject-checkout.html'"
        >
          გაგრძელება — სტანდარტული
        </button>
      </div>
    </footer>
    <script>
      // ფასები და შესაძლებლობები შეცვალეთ მხოლოდ ამ მონაცემებში.

      const plans = [
        {
          id: "basic",
          name: "საბაზისო",
          price: 19,
          features: [
            "თეორია",
            "სავარჯიშოები",
            "სასწავლო თემების ჩამონათვალი",
            "AI მენტორის საბაზისო დახმარება",
          ],
          extra: ["დამატებითი ფუნქციები მოგვიანებით დაზუსტდება"],
        },
        {
          id: "standard",
          name: "სტანდარტული",
          price: 29,
          features: [
            "თეორია",
            "სავარჯიშოები და ტესტები",
            "სასწავლო პროგრესის ნახვა",
            "AI მენტორი — ინდივიდუალური დახმარება",
          ],
          extra: ["პაკეტის საბოლოო პირობები მოგვიანებით დაზუსტდება"],
        },
        {
          id: "premium",
          name: "პრემიუმი",
          price: 49,
          features: [
            "თეორია",
            "სავარჯიშოები და ტესტები",
            "პერსონალიზებული სწავლება",
            "AI მენტორი — გაფართოებული დახმარება",
          ],
          extra: ["პაკეტის საბოლოო პირობები მოგვიანებით დაზუსტდება"],
        },
      ];
      let selected = "standard";
      const root = document.getElementById("packs");
      function render() {
        root.innerHTML = plans
          .map(
            (p) =>
              `<article class="pack ${p.id} ${selected === p.id ? "selected" : ""}"><div class="packhead" role="button" tabindex="0" data-select="${p.id}" aria-label="${p.name} პაკეტის არჩევა"><div>${p.id === "standard" ? '<span class="pill">ყველაზე პოპულარული</span>' : ""}<h2 class="packtitle">${p.name}</h2><div class="price">${p.price} ₾ <span class="unit">/ თვე</span></div></div><span class="circle" aria-hidden="true"></span></div><div class="packbody"><ul class="features">${p.features.map((f) => `<li><span class="check">✓</span><span>${f}</span></li>`).join("")}</ul><div class="extra" id="extra-${p.id}" hidden><ul class="features">${p.extra.map((f) => `<li><span class="check">✓</span><span>${f}</span></li>`).join("")}</ul></div><button class="more" data-more="${p.id}" aria-expanded="false">სრულად ნახვა ⌄</button></div></article>`,
          )
          .join("");
        document.getElementById("cta").textContent =
          "გაგრძელება — " + plans.find((p) => p.id === selected).name;
        root.querySelectorAll("[data-select]").forEach((el) => {
          const choose = () => {
            selected = el.dataset.select;
            render();
          };
          el.addEventListener("click", choose);
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              choose();
            }
          });
        });
        root.querySelectorAll("[data-more]").forEach(
          (btn) =>
            (btn.onclick = () => {
              const x = document.getElementById("extra-" + btn.dataset.more);
              x.hidden = !x.hidden;
              btn.textContent = x.hidden
                ? "სრულად ნახვა ⌄"
                : "ნაკლების ნახვა ⌃";
              btn.setAttribute("aria-expanded", String(!x.hidden));
            }),
        );
      }
      render();
      document.getElementById("cta").onclick = () => {
        window.location.href = "parent-subject-checkout.html";
      };
    </script>
  </body>
</html>
