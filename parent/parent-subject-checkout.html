<!doctype html>

<html lang="ka">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>AIIA — გადახდა</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --purple: #6c63ff;

        --dark: #181735;

        --line: #c8baff;

        --pale: #e7e0ff;

        --muted: #656b87;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        background: #fff;

        color: var(--dark);

        font-family: "Noto Sans Georgian", Arial, sans-serif;
      }

      .wrap {
        max-width: 720px;

        margin: auto;

        padding: 0 16px 110px;
      }

      .header {
        display: flex;

        align-items: center;

        gap: 12px;

        padding: 17px 0;

        border-bottom: 1px solid #ded9f2;

        margin-bottom: 20px;
      }

      .back {
        width: 38px;

        height: 38px;

        border: 1px solid #dcd7f4;

        border-radius: 12px;

        display: grid;

        place-items: center;

        text-decoration: none;

        color: #5542e8;

        font-size: 25px;

        background: #faf9ff;
      }

      .header h1 {
        font-size: 21px;

        margin: 0;

        font-weight: 800;

        flex: 1;
      }

      .logo {
        font-size: 22px;

        font-weight: 800;

        color: #5f40eb;

        letter-spacing: -1px;
      }

      .intro {
        font-size: 12px;

        font-weight: 700;

        color: #6d7290;

        margin: 0 0 17px;
      }

      .panel {
        border: 1.5px solid var(--line);

        border-radius: 19px;

        overflow: hidden;

        background: white;

        margin-bottom: 16px;
      }

      .panel-head {
        display: flex;

        align-items: center;

        gap: 10px;

        background: linear-gradient(100deg, #e5dcff, #d9cefb);

        padding: 11px 13px;

        border-bottom: 1.5px solid #c5b5ff;
      }

      .panel-head h2 {
        font-size: 15px;

        margin: 0;

        font-weight: 800;
      }

      .symbol {
        display: grid;

        place-items: center;

        width: 34px;

        height: 34px;

        border-radius: 11px;

        border: 1px solid #a994ff;

        background: #fff;

        color: #5e3cec;
      }

      .symbol svg {
        width: 20px;

        height: 20px;
      }

      .body {
        padding: 16px;
      }

      .package-row {
        display: flex;

        align-items: center;

        gap: 12px;
      }

      .package-icon {
        width: 48px;

        height: 48px;

        border-radius: 14px;

        background: #f0eaff;

        display: grid;

        place-items: center;

        color: #6346ed;

        flex-shrink: 0;
      }

      .package-icon svg {
        width: 27px;

        height: 27px;
      }

      .package-info {
        flex: 1;

        min-width: 0;
      }

      .package-name {
        font-size: 17px;

        font-weight: 800;
      }

      .meta {
        display: flex;

        flex-wrap: wrap;

        gap: 6px;

        margin-top: 9px;
      }

      .meta-chip {
        display: inline-flex;

        align-items: center;

        border: 1px solid #dcd3ff;

        background: #f7f4ff;

        color: #5444a8;

        border-radius: 9px;

        padding: 5px 9px;

        font-size: 11px;

        font-weight: 700;
      }

      .price {
        font-size: 23px;

        font-weight: 800;

        color: #643dea;

        white-space: nowrap;

        border-left: 1px solid #cfc5ef;

        padding-left: 13px;
      }

      .change {
        display: block;

        margin: 15px auto 0;

        padding: 10px 18px;

        border: 1.5px solid #704cff;

        border-radius: 12px;

        background: #fff;

        color: #5a39df;

        text-decoration: none;

        font-size: 12px;

        font-weight: 800;

        text-align: center;

        width: max-content;

        max-width: 100%;
      }

      .field-title {
        font-size: 13px;

        font-weight: 800;

        margin: 0 0 12px;
      }

      .students {
        display: grid;

        grid-template-columns: 1fr;

        gap: 10px;
      }

      .student {
        display: flex;

        align-items: center;

        gap: 9px;

        min-width: 0;

        border: 1.5px solid #dedfeb;

        border-radius: 14px;

        background: white;

        padding: 12px 14px;

        cursor: pointer;

        text-align: left;

        font: inherit;
      }

      .student.selected {
        border: 2px solid #6745ff;

        background: #f6f2ff;
      }

      .avatar {
        width: 39px;

        height: 39px;

        border-radius: 50%;

        background: #e9e0ff;

        display: grid;

        place-items: center;

        font-size: 21px;

        flex-shrink: 0;
      }

      .avatar {
        overflow: hidden;

        position: relative;
      }

      .avatar img {
        display: block;

        width: 100%;

        height: 100%;

        object-fit: cover;

        border-radius: 50%;
      }

      .student-name {
        font-weight: 800;

        font-size: 13px;
      }

      .student-grade {
        font-size: 10px;

        color: #646b86;

        margin-top: 3px;
      }

      .student-info {
        flex: 1;

        min-width: 0;
      }

      .radio {
        width: 20px;

        height: 20px;

        border-radius: 50%;

        border: 2px solid #a6a8bc;

        flex-shrink: 0;

        display: grid;

        place-items: center;
      }

      .selected .radio {
        border-color: #6645ef;
      }

      .selected .radio:after {
        content: "";

        width: 10px;

        height: 10px;

        background: #6645ef;

        border-radius: 50%;
      }

      .methods {
        display: grid;

        grid-template-columns: repeat(3, minmax(0, 1fr));

        gap: 9px;
      }

      .method {
        border: 1.5px solid #dcddea;

        border-radius: 14px;

        background: #fff;

        min-height: 92px;

        display: flex;

        align-items: center;

        justify-content: center;

        flex-direction: column;

        gap: 9px;

        cursor: pointer;

        padding: 10px 4px;

        font: inherit;

        font-weight: 800;

        font-size: 11px;
      }

      .method.selected {
        border: 2px solid #6645ff;

        background: #f7f4ff;

        color: #5d3cec;
      }

      .payment-logo {
        font-family: Arial, sans-serif;

        font-size: 19px;

        font-weight: 700;

        white-space: nowrap;
      }

      .google-g {
        font-weight: 800;

        background: conic-gradient(
          #4285f4 0 25%,

          #34a853 25% 45%,

          #fbbc05 45% 65%,

          #ea4335 65% 80%,

          #4285f4 80%
        );

        background-clip: text;

        -webkit-background-clip: text;

        color: transparent;
      }

      .apple-logo {
        font-size: 25px;

        color: #151515;
      }

      .card-icon {
        width: 34px;

        height: 25px;

        border-radius: 5px;

        background: linear-gradient(130deg, #285eea, #6b4ff2);

        position: relative;

        box-shadow: 0 3px 7px #a3a6ed;
      }

      .card-icon:before {
        content: "";

        position: absolute;

        top: 7px;

        left: 4px;

        right: 4px;

        height: 4px;

        background: #dce8ff;
      }

      .card-icon:after {
        content: "";

        position: absolute;

        bottom: 5px;

        left: 5px;

        width: 11px;

        height: 3px;

        background: #ffd46c;

        border-radius: 2px;
      }

      .footer {
        position: fixed;

        bottom: 0;

        left: 0;

        right: 0;

        background: #ffffffef;

        backdrop-filter: blur(10px);

        border-top: 1px solid #e9e5f7;

        padding: 12px 16px max(13px, env(safe-area-inset-bottom));
      }

      .footer-inner {
        max-width: 688px;

        margin: auto;
      }

      .pay {
        width: 100%;

        padding: 16px 12px;

        border: 0;

        border-radius: 15px;

        background: linear-gradient(100deg, #6c45f3, #5830e5);

        color: #fff;

        font: inherit;

        font-size: 16px;

        font-weight: 800;

        cursor: pointer;

        box-shadow: 0 7px 17px #6c63ff30;
      }

      .message {
        display: none;

        background: #fff5e8;

        border: 1px solid #f4c88d;

        color: #7c4c14;

        padding: 13px;

        border-radius: 12px;

        margin: 12px 0;

        font-size: 12px;
      }

      .message.show {
        display: block;
      }

      @media (max-width: 370px) {
        .student {
          gap: 5px;

          padding: 9px 6px;
        }

        .avatar {
          width: 31px;

          height: 31px;

          font-size: 17px;
        }

        .student-name {
          font-size: 11px;
        }

        .price {
          font-size: 19px;
        }

        .methods {
          gap: 5px;
        }

        .payment-logo {
          font-size: 15px;
        }
      }

      /* AIIA Design System v1.1 — checkout */

      :root {
        --purple: #6c63ff;

        --dark: #111827;

        --muted: #6b7280;

        --line: #d8dce6;

        --pale: #eff0f4;

        --secondary: #4a90ff;

        --success: #22c55e;

        --warning: #f59e0b;
      }

      body {
        background: #ffffff;
        color: var(--dark);
      }

      .header {
        border-bottom-color: #e5e7eb;
      }

      .header h1 {
        font-size: 24px;
        font-weight: 600;
      }

      .logo {
        color: var(--purple);
        font-weight: 700;
      }

      .intro {
        color: var(--muted);
        font-size: 14px;
        font-weight: 400;
      }

      .back {
        color: var(--purple);
        background: #eff0f4;
        border-color: #d8dce6;
      }

      .panel {
        border: 1px solid #d8dce6;
        background: #ffffff;
      }

      .panel-head {
        background: #eff0f4;
        border-bottom: 1px solid #d8dce6;
      }

      .panel-head h2 {
        color: #111827;
        font-size: 18px;
        font-weight: 600;
      }

      .symbol {
        color: var(--purple);
        border-color: #d8dce6;
        background: #ffffff;
      }

      .body {
        background: #ffffff;
      }

      .package-icon {
        background: #eff0f4;
        color: var(--purple);
      }

      .package-name {
        font-size: 18px;
        font-weight: 600;
      }

      .price {
        color: var(--purple);
        font-weight: 700;
      }

      .meta-chip {
        background: #eff0f4;
        color: #6b7280;
        border-color: #d8dce6;
      }

      .change {
        border-color: var(--purple);
        color: var(--purple);
        font-weight: 600;
      }

      .field-title {
        font-size: 14px;
        font-weight: 600;
      }

      .student,
      .method {
        border-color: #d8dce6;
        background: #ffffff;
      }

      .student.selected,
      .method.selected {
        border: 2px solid var(--purple);
        background: #eff0f4;
        color: #111827;
      }

      .student-name {
        font-size: 14px;
        font-weight: 600;
      }

      .student-grade {
        color: var(--muted);
        font-size: 12px;
      }

      .selected .radio {
        border-color: var(--purple);
      }

      .selected .radio:after {
        background: var(--purple);
      }

      .method {
        font-size: 12px;
        font-weight: 500;
      }

      .footer {
        border-top-color: #e5e7eb;
      }

      .pay {
        background: var(--purple);
        font-weight: 600;
        box-shadow: 0 7px 17px #6c63ff30;
      }

      :focus-visible {
        outline: 3px solid var(--secondary);
        outline-offset: 3px;
      }
    </style>
  </head>

  <body>
    <main class="wrap">
      <header class="header">
        <a
          class="back"
          href="parent-subject-pricing.html"
          aria-label="უკან დაბრუნება"
          >‹</a
        >

        <h1>გადახდა</h1>

        <span class="logo">AIIA</span>
      </header>

      <p class="intro">შეამოწმე შეკვეთა და აირჩიე გადახდის მეთოდი.</p>

      <section class="panel">
        <div class="panel-head">
          <span class="symbol" aria-hidden="true"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m12 3 9 5-9 5-9-5 9-5Z" />

              <path d="m3 12 9 5 9-5M3 16l9 5 9-5" /></svg
          ></span>

          <h2>შერჩეული პაკეტი</h2>
        </div>

        <div class="body">
          <div class="package-row">
            <span class="package-icon" aria-hidden="true"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="4" y="4" width="16" height="16" rx="3" />

                <path d="M8 8h8M8 12h8M8 16h5" /></svg
            ></span>

            <div class="package-info">
              <div class="package-name" id="package-name">სტანდარტული</div>

              <div class="meta">
                <span class="meta-chip">VII კლასი</span
                ><span class="meta-chip">მათემატიკა</span>
              </div>
            </div>

            <div class="price" id="package-price">29 ₾</div>
          </div>

          <a class="change" id="change-plan" href="parent-subject-pricing.html"
            >↻ &nbsp; პაკეტის შეცვლა</a
          >
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="symbol" aria-hidden="true"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="8" r="3.5" />

              <path d="M5 20v-2a7 7 0 0 1 14 0v2M3 4h3M18 4h3" /></svg
          ></span>

          <h2>მოსწავლის არჩევა</h2>
        </div>

        <div class="body">
          <p class="field-title">ვისთვის ყიდულობ საგანს?</p>

          <div class="students" id="students">
            <button
              class="student selected"
              type="button"
              data-student="giorgi"
              aria-pressed="true"
            >
              <span class="avatar"
                ><img
                  src="../img/leaderboard-luka.png"
                  alt="გიორგი ბერიძის ფოტო" /></span
              ><span class="student-info"
                ><span class="student-name">გიორგი ბერიძე</span>

                <div class="student-grade">VII კლასი</div></span
              ><span class="radio"></span></button
            ><button
              class="student"
              type="button"
              data-student="nino"
              aria-pressed="false"
            >
              <span class="avatar"
                ><img
                  src="../img/leaderboard-mariam.png"
                  alt="ნინო ბერიძის ფოტო" /></span
              ><span class="student-info"
                ><span class="student-name">ნინო ბერიძე</span>

                <div class="student-grade">VII კლასი</div></span
              ><span class="radio"></span>
            </button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="symbol" aria-hidden="true">▤</span>

          <h2>გადახდის მეთოდი</h2>
        </div>

        <div class="body">
          <div class="methods">
            <button
              class="method selected"
              type="button"
              data-method="card"
              aria-pressed="true"
            >
              <span class="card-icon" aria-hidden="true"></span>ბარათი</button
            ><button
              class="method"
              type="button"
              data-method="google"
              aria-pressed="false"
            >
              <span class="payment-logo"
                ><span class="google-g">G</span> Pay</span
              >Google Pay</button
            ><button
              class="method"
              type="button"
              data-method="apple"
              aria-pressed="false"
            >
              <span class="payment-logo"
                ><span class="apple-logo">●</span> Pay</span
              >Apple Pay
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <button class="pay" id="pay" type="button">გადახდა — 29 ₾ →</button>
      </div>
    </footer>

    <script>
      // სადემონსტრაციო ფასები და მოსწავლეები. რეალური გადახდის ინტეგრაცია ჯერ არ არის ჩართული.

      const plans = {
        basic: { name: "საბაზისო", price: 19 },

        standard: { name: "სტანდარტული", price: 29 },

        premium: { name: "პრემიუმი", price: 49 },
      };

      const params = new URLSearchParams(location.search);

      const requested = (
        params.get("package") ||
        params.get("plan") ||
        "standard"
      ).toLowerCase();

      const plan = Object.hasOwn(plans, requested) ? requested : "standard";

      const current = plans[plan];

      document.getElementById("package-name").textContent = current.name;

      document.getElementById("package-price").textContent =
        current.price + " ₾";

      document.getElementById("pay").textContent =
        "გადახდა — " + current.price + " ₾ →";

      document.getElementById("change-plan").href =
        "parent-subject-pricing.html";

      let student = "giorgi",
        method = "card";

      document.querySelectorAll("[data-student]").forEach((btn) =>
        btn.addEventListener("click", () => {
          student = btn.dataset.student;

          document.querySelectorAll("[data-student]").forEach((b) => {
            const active = b === btn;

            b.classList.toggle("selected", active);

            b.setAttribute("aria-pressed", String(active));
          });
        }),
      );

      document.querySelectorAll("[data-method]").forEach((btn) =>
        btn.addEventListener("click", () => {
          method = btn.dataset.method;

          document.querySelectorAll("[data-method]").forEach((b) => {
            const active = b === btn;

            b.classList.toggle("selected", active);

            b.setAttribute("aria-pressed", String(active));
          });
        }),
      );

      document.getElementById("pay").addEventListener("click", () => {
        const query = new URLSearchParams({
          plan: plan,

          student: student,

          method: method,
        });

        window.location.href =
          "parent-subject-success.html?" + query.toString();
      });
    </script>
  </body>
</html>
