<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AIIA — აირჩიე როლი</title>

    <style>
      :root {
        /* AIIA Color System v1.0 */
        --primary: #6c63ff;
        --secondary: #4a90ff;
        --achievement: #f59e0b;
        --success: #22c55e;
        --error: #ff4d4f;

        --page-background: #ffffff;
        --section-background: #f8fafc;

        --text-primary: #111827;
        --text-secondary: #6b7280;
        --text-white: #ffffff;

        --button-active: #6c63ff;
        --button-disabled: #e5e7eb;

        --report-positive: #f0fdf4;
        --report-negative: #fff1f2;

        /* AIIA Typography System v1.0 */
        --font-family: "Noto Sans Georgian", Arial, sans-serif;

        --font-h1: 28px;
        --font-h2: 24px;
        --font-h3: 20px;
        --font-title: 18px;
        --font-body-large: 16px;
        --font-body: 14px;
        --font-label: 14px;
        --font-caption: 12px;

        --weight-regular: 400;
        --weight-medium: 500;
        --weight-semibold: 600;
        --weight-bold: 700;
      }

      * {
        box-sizing: border-box;
      }

      html {
        width: 100%;
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--page-background);
        font-family: var(--font-family);
        color: var(--text-primary);
      }

      .page {
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0 auto;
        padding: clamp(55px, 9dvh, 85px) 16px 40px;
      }

      /* Logo */
      .logo {
        text-align: center;
        color: var(--primary);
        font-size: var(--font-h1);
        font-weight: var(--weight-bold);
        letter-spacing: -1px;
        margin-bottom: 28px;
      }

      /* Page title */
      h1 {
        text-align: center;
        font-size: var(--font-h1);
        line-height: 1.4;
        margin: 0 0 28px;
        font-weight: var(--weight-bold);
      }

      h1 span {
        color: var(--primary);
      }

      /* Role cards */
      .role-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .role-card {
        width: 100%;
        min-height: 170px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
        padding: 14px;
        border-radius: 18px;
        cursor: pointer;
        text-align: left;
        font-family: var(--font-family);
        color: var(--text-primary);
        background: var(--section-background);

        box-shadow: 0 3px 9px rgba(0, 0, 0, 0.05);

        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .role-card:active {
        transform: scale(0.98);
      }

      .role-card:focus-visible {
        outline: 3px solid var(--secondary);
        outline-offset: 3px;
      }

      /* Student card */
      .student {
        border: 1px solid var(--primary);
      }

      /* Parent card */
      .parent {
        border: 1px solid var(--success);
      }

      /* Images */
      .role-image {
        width: 55%;
        height: 150px;
        object-fit: contain;
        align-self: flex-end;
      }

      /* Card content */
      .role-info {
        width: 45%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        z-index: 1;
      }

      .role-icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: 21px;
      }

      .student .role-icon {
        color: var(--primary);
        background: var(--section-background);
      }

      .parent .role-icon {
        color: var(--success);
        background: var(--section-background);
      }

      .role-name {
        font-size: var(--font-title);
        font-weight: var(--weight-semibold);
        color: var(--text-primary);
      }

      .dots {
        display: flex;
        gap: 5px;
      }

      .dots i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.35;
      }

      .student .dots {
        color: var(--primary);
      }

      .parent .dots {
        color: var(--success);
      }

      /* Arrow buttons */
      .arrow {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: var(--text-white);
        display: grid;
        place-items: center;
        font-size: var(--font-h3);
        font-weight: var(--weight-semibold);
        margin-top: 2px;
      }

      .student .arrow {
        background: var(--primary);
      }

      .parent .arrow {
        background: var(--success);
      }

      /* Small mobile screens */
      @media (max-width: 360px) {
        .page {
          padding: 45px 12px 32px;
        }

        .role-card {
          min-height: 145px;
          padding: 10px;
        }

        .role-image {
          height: 130px;
        }
      }

      /* Short screens */
      @media (max-height: 650px) {
        .page {
          padding-top: 30px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .role-card {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="logo">AIIA</div>

      <h1>გაიარე <span>რეგისტრაცია</span></h1>

      <div class="role-list">
        <!-- მოსწავლე -->
        <button class="role-card student" type="button" onclick="goToStudent()">
          <img
            class="role-image"
            src="img/role_selection_student.png"
            alt="მოსწავლეები"
          />

          <div class="role-info">
            <div class="role-icon">🎓</div>
            <div class="role-name">მოსწავლე</div>
            <div class="arrow">→</div>
          </div>
        </button>

        <!-- მშობელი -->
        <button class="role-card parent" type="button" onclick="goToParent()">
          <img
            class="role-image"
            src="img/role_selection_parent.png"
            alt="მშობელი და ბავშვი"
          />

          <div class="role-info">
            <div class="role-icon">♟</div>
            <div class="role-name">მშობელი</div>
            <div class="arrow">→</div>
          </div>
        </button>
      </div>
    </main>

    <script>
      function goToStudent() {
        window.location.href = "student-login.html";
      }

      function goToParent() {
        window.location.href = "parent/parent-auth.html";
      }
    </script>
  </body>
</html>
